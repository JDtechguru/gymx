<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymX">
<meta name="theme-color" content="#0A0A0D">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF2E63'/%3E%3Cstop offset='1' stop-color='%23FF8A3D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230A0A0D'/%3E%3Cpath d='M70 28L30 72' stroke='%23fff' stroke-width='15' stroke-linecap='round'/%3E%3Cpath d='M30 28L70 72' stroke='%230A0A0D' stroke-width='24' stroke-linecap='round'/%3E%3Cpath d='M30 28L70 72' stroke='url(%23g)' stroke-width='15' stroke-linecap='round'/%3E%3C/svg%3E">
<title>GymX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0D;
    --surface:#15151B;
    --surface-2:#1C1C24;
    --border:#25252E;
    --text:#FFFFFF;
    --muted:#A3A3B2;
    --faint:#646472;
    --accent:#FF2E63;
    --accent-2:#FF8A3D;
    --grad:linear-gradient(135deg,var(--accent),var(--accent-2));
    --radius:16px;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,'Helvetica Neue',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    -webkit-user-select:none; user-select:none;
  }
  button{font-family:inherit; cursor:pointer;}
  .display{font-family:'Oswald','Arial Narrow',sans-serif; font-weight:700; letter-spacing:.3px;}
  #app{transition:opacity .25s var(--ease), transform .25s var(--ease);}
  #app.swap{opacity:0; transform:scale(.985);}

  /* ---------- top bar ---------- */
  .top{
    position:sticky; top:0; z-index:15;
    padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
    background:rgba(10,10,13,.82);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    display:flex; align-items:center; gap:10px;
  }
  .logo{width:32px; height:32px; flex-shrink:0;}
  .wordmark{font-size:20px; letter-spacing:1.5px;}
  .wordmark span{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .spacer{flex:1;}
  .ver-pill{
    border:1px solid var(--border); background:var(--surface);
    color:var(--muted); font-size:12px; font-weight:700;
    padding:6px 11px; border-radius:20px; letter-spacing:.5px;
  }
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .top-bar-progress{
    position:absolute; left:0; bottom:0; height:2px; width:100%;
    background:transparent; overflow:hidden;
  }
  .top-bar-progress i{display:block; height:100%; width:0; background:var(--grad); transition:width .5s var(--ease);}

  /* ---------- hero ---------- */
  .hero{
    margin:6px 16px 0; border-radius:22px; position:relative; overflow:hidden;
    padding:20px 18px 18px; min-height:168px;
    background:linear-gradient(135deg,var(--h1),var(--h2));
    display:flex; align-items:flex-end; gap:12px;
    box-shadow:0 18px 40px -18px var(--h1);
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.22), transparent 55%),
               radial-gradient(90% 80% at 0% 100%, rgba(0,0,0,.35), transparent 60%);
    pointer-events:none;
  }
  .hero-wm{
    position:absolute; right:-6px; top:-26px;
    font-family:'Oswald',sans-serif; font-weight:700;
    font-size:150px; line-height:1; color:rgba(255,255,255,.13);
    pointer-events:none;
  }
  .hero-left{position:relative; flex:1; min-width:0;}
  .hero-kicker{font-size:11.5px; font-weight:800; letter-spacing:2px; color:rgba(255,255,255,.85);}
  .hero-title{font-size:32px; line-height:1.05; margin:6px 0 6px; text-transform:uppercase;}
  .hero-sub{font-size:13px; color:rgba(255,255,255,.88); font-weight:500;}
  .ring{position:relative; width:84px; height:84px; flex-shrink:0;}
  .ring svg{width:84px; height:84px; transform:rotate(-90deg);}
  .ring .track{stroke:rgba(0,0,0,.25);}
  .ring .val{stroke:#fff; transition:stroke-dashoffset .7s var(--ease);}
  .ring-pct{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .ring-pct b{font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; line-height:1;}
  .ring-pct small{font-size:9.5px; font-weight:700; letter-spacing:1px; opacity:.85; margin-top:2px;}
  .ring.full{animation:ringPop .6s var(--ease);}
  @keyframes ringPop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

  /* ---------- cycle strip ---------- */
  .cycle{display:flex; gap:8px; padding:14px 16px 4px;}
  .cyc{
    flex:1; border-radius:12px; background:var(--surface); border:1px solid var(--border);
    padding:8px 4px 7px; text-align:center; position:relative; overflow:hidden;
    transition:transform .2s var(--ease), border-color .2s;
  }
  .cyc:active{transform:scale(.95);}
  .cyc b{display:block; font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; color:var(--muted);}
  .cyc small{display:block; font-size:9.5px; color:var(--faint); font-weight:700; letter-spacing:.4px; margin-top:1px;}
  .cyc .fill{position:absolute; left:0; bottom:0; height:3px; background:var(--grad); transition:width .5s var(--ease);}
  .cyc.past b{color:var(--text);}
  .cyc.past small{color:var(--muted);}
  .cyc.current{border-color:var(--accent); background:var(--surface-2);}
  .cyc.current b{color:var(--text);}
  .cyc.current small{color:var(--accent-2);}

  /* ---------- stats ---------- */
  .stats{display:flex; gap:8px; padding:8px 16px 2px; flex-wrap:wrap;}
  .stat{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--muted); font-weight:600;
    background:var(--surface); border:1px solid var(--border);
    padding:6px 10px; border-radius:20px;
  }
  .stat svg{width:14px; height:14px;}
  .stat b{color:var(--text);}

  /* ---------- list ---------- */
  main{padding:8px 16px 150px;}
  .tip{
    margin:12px 0 4px; padding:11px 13px; border-radius:12px;
    background:linear-gradient(135deg,rgba(255,46,99,.12),rgba(255,138,61,.08));
    border:1px solid rgba(255,46,99,.25);
    font-size:12.5px; color:#FFD9CC; line-height:1.45;
  }
  .tip b{color:#fff;}
  .group{font-size:11.5px; font-weight:800; letter-spacing:1.8px; color:var(--faint); margin:22px 0 9px 2px; text-transform:uppercase;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:10px;
    display:flex; gap:13px; align-items:flex-start;
    transition:transform .18s var(--ease), opacity .3s var(--ease), background .3s, border-color .3s;
    animation:fadeUp .42s var(--ease) both;
    animation-delay:calc(var(--i) * 40ms);
  }
  .card:active{transform:scale(.975);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  .card.done{opacity:.5; background:#111116;}
  .check{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    border:2px solid var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; position:relative;
    font-family:'Oswald',sans-serif; font-size:14px; font-weight:600; color:var(--muted);
    transition:background .25s, border-color .25s;
  }
  .check svg{position:absolute; width:18px; height:18px; opacity:0;}
  .check svg path{stroke-dasharray:24; stroke-dashoffset:24;}
  .card.done .check{background:var(--grad); border-color:transparent; color:transparent;}
  .card.done .check svg{opacity:1;}
  .card.done .check svg path{animation:draw .35s .05s var(--ease) forwards;}
  .card.pop .check{animation:pop .45s var(--ease);}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
  .body{flex:1; min-width:0;}
  .chip{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:1.2px;
    padding:3px 8px; border-radius:6px; margin-bottom:6px; text-transform:uppercase;
    color:var(--c); background:color-mix(in srgb, var(--c) 16%, transparent);
  }
  .name{font-size:16.5px; font-weight:700; line-height:1.25;}
  .card.done .name{text-decoration:line-through; text-decoration-color:var(--faint);}
  .meta{margin-top:5px; font-size:13px; color:var(--muted); font-weight:500;}
  .meta b{color:var(--text); font-weight:700;}
  .sub{margin-top:3px; font-size:12px; color:var(--faint);}
  .note{margin-top:6px; font-size:12.5px; color:var(--accent-2); font-weight:600;}
  .opt-btn{
    margin-top:10px; background:none; border:1px solid var(--border);
    color:var(--muted); font-size:12px; font-weight:700;
    padding:6px 11px; border-radius:20px; display:inline-flex; align-items:center; gap:6px;
  }
  .opt-btn .car{display:inline-block; transition:transform .25s var(--ease);}
  .opt-btn.open .car{transform:rotate(180deg);}
  .opts{max-height:0; overflow:hidden; transition:max-height .35s var(--ease);}
  .opts-inner{padding-top:10px;}
  .opt{
    display:flex; gap:10px; align-items:center;
    padding:8px 0; border-top:1px solid var(--border);
    font-size:13.5px; color:var(--text);
  }
  .opt span{
    font-family:'Oswald',sans-serif; font-size:11px; color:var(--accent-2);
    border:1px solid rgba(255,138,61,.4); border-radius:6px; padding:1px 6px; flex-shrink:0;
  }
  .rule{font-size:12px; color:var(--muted); padding-top:8px; border-top:1px solid var(--border);}

  /* ---------- footer ---------- */
  footer{
    position:fixed; left:0; right:0; bottom:0; z-index:12;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(to top, var(--bg) 70%, rgba(10,10,13,0));
  }
  .cta{
    width:100%; padding:17px; border:none; border-radius:16px;
    font-family:'Oswald',sans-serif; font-size:17px; font-weight:600; letter-spacing:1px;
    background:var(--surface-2); color:var(--muted);
    transition:transform .15s var(--ease), background .3s;
    position:relative; overflow:hidden;
  }
  .cta:active{transform:scale(.97);}
  .cta.ready{background:var(--grad); color:#fff; box-shadow:0 10px 30px -10px var(--accent); animation:glow 1.8s ease-in-out infinite;}
  .cta.ready::after{
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-20deg); animation:shine 2.4s ease-in-out infinite;
  }
  @keyframes glow{0%,100%{box-shadow:0 10px 30px -12px var(--accent)}50%{box-shadow:0 10px 36px -6px var(--accent)}}
  @keyframes shine{0%{left:-60%}60%,100%{left:130%}}
  .skip{display:block; text-align:center; margin-top:9px; font-size:12px; color:var(--faint); background:none; border:none; width:100%;}

  /* ---------- sheet ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); opacity:0; pointer-events:none; transition:opacity .25s; z-index:30;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:31;
    background:#121217; border-top:1px solid var(--border); border-radius:24px 24px 0 0;
    padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);
    transform:translateY(105%); transition:transform .35s var(--ease);
    max-height:86vh; overflow-y:auto;
  }
  .sheet.open{transform:none;}
  .grab{width:40px; height:5px; border-radius:3px; background:var(--border); margin:0 auto 16px;}
  .sheet h3{margin:18px 0 10px; font-size:12px; font-weight:800; letter-spacing:1.8px; color:var(--faint);}
  .sheet h3:first-of-type{margin-top:4px;}
  .ver{
    width:100%; text-align:left; border:1.5px solid var(--border); background:var(--surface);
    color:var(--text); border-radius:16px; padding:14px; margin-bottom:9px;
    display:flex; gap:12px; align-items:center; transition:border-color .2s, transform .15s;
  }
  .ver:active{transform:scale(.98);}
  .ver.active{border-color:var(--accent); background:linear-gradient(135deg,rgba(255,46,99,.12),rgba(255,138,61,.05));}
  .ver-badge{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:17px; font-weight:700; color:var(--muted);
  }
  .ver.active .ver-badge{background:var(--grad); color:#fff;}
  .ver-txt b{display:block; font-size:15px;}
  .ver-txt small{display:block; font-size:12px; color:var(--muted); margin-top:3px; line-height:1.35;}
  .ver-txt em{display:block; font-style:normal; font-size:11px; color:var(--accent-2); margin-top:5px; font-weight:700;}
  .rules div{font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:9px;}
  .rules b{color:var(--text);}
  .danger{
    width:100%; margin-top:6px; padding:13px; border-radius:14px;
    border:1px solid rgba(255,80,80,.35); background:rgba(255,80,80,.08);
    color:#FF7B7B; font-size:14px; font-weight:700;
  }

  /* ---------- celebration ---------- */
  .celebrate{
    position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background:rgba(6,6,9,.9); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; transition:opacity .3s;
    padding:24px;
  }
  .celebrate.open{opacity:1; pointer-events:auto;}
  #confetti{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .cele-card{position:relative; text-align:center; max-width:340px; width:100%; transform:scale(.9); transition:transform .45s var(--ease);}
  .celebrate.open .cele-card{transform:none;}
  .cele-medal{
    width:108px; height:108px; margin:0 auto 18px; border-radius:50%;
    background:var(--grad); display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 10px rgba(255,46,99,.12), 0 20px 50px -10px var(--accent);
    animation:medal 1.4s var(--ease);
  }
  .cele-medal b{font-family:'Oswald',sans-serif; font-size:34px; font-weight:700;}
  @keyframes medal{0%{transform:scale(.3) rotate(-30deg); opacity:0}60%{transform:scale(1.1) rotate(6deg); opacity:1}100%{transform:none}}
  .cele-title{font-size:34px; line-height:1.05; text-transform:uppercase;}
  .cele-title span{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .cele-sub{color:var(--muted); font-size:14px; margin:10px 0 18px; line-height:1.45;}
  .cele-stats{display:flex; gap:8px; margin-bottom:18px;}
  .cele-stats div{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:11px 6px;}
  .cele-stats b{display:block; font-family:'Oswald',sans-serif; font-size:22px;}
  .cele-stats small{font-size:10px; color:var(--faint); font-weight:800; letter-spacing:1px;}
  .next-up{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:14px; text-align:left;}
  .next-up small{font-size:10.5px; color:var(--faint); font-weight:800; letter-spacing:1.5px;}
  .next-up b{display:block; font-size:16px; margin-top:3px;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF2E63"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient></defs>
      <rect width="100" height="100" rx="24" fill="#16161C"/>
      <path d="M70 28L30 72" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
      <path d="M30 28L70 72" stroke="#16161C" stroke-width="24" stroke-linecap="round"/>
      <path d="M30 28L70 72" stroke="url(#lg)" stroke-width="15" stroke-linecap="round"/>
    </svg>
    <div class="wordmark display">GYM<span>X</span></div>
    <div class="spacer"></div>
    <button class="ver-pill" id="verPill">V2</button>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">&#8942;</button>
    <div class="top-bar-progress"><i id="topProg"></i></div>
  </div>

  <section class="hero" id="hero">
    <div class="hero-wm" id="heroWm">01</div>
    <div class="hero-left">
      <div class="hero-kicker" id="heroKicker">DAY 1 OF 5</div>
      <div class="hero-title display" id="heroTitle">—</div>
      <div class="hero-sub" id="heroSub"></div>
    </div>
    <div class="ring" id="ring">
      <svg viewBox="0 0 84 84">
        <circle class="track" cx="42" cy="42" r="36" fill="none" stroke-width="8"/>
        <circle class="val" id="ringVal" cx="42" cy="42" r="36" fill="none" stroke-width="8" stroke-linecap="round"/>
      </svg>
      <div class="ring-pct"><b id="pct">0%</b><small>DONE</small></div>
    </div>
  </section>

  <div class="cycle" id="cycle"></div>
  <div class="stats" id="stats"></div>
  <main id="list"></main>
</div>

<footer>
  <button class="cta" id="cta">START</button>
  <button class="skip" id="skip">Finish anyway, skip the rest</button>
</footer>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3>VERSION SWITCHER</h3>
  <div id="versions"></div>
  <h3>RULES FOR THIS PLAN</h3>
  <div class="rules" id="rules"></div>
  <button class="danger" id="resetBtn">Reset progress for this version</button>
</div>

<div class="celebrate" id="celebrate">
  <canvas id="confetti"></canvas>
  <div class="cele-card">
    <div class="cele-medal"><b id="celeNum">01</b></div>
    <div class="cele-title display" id="celeTitle">DAY 1 <span>CRUSHED</span></div>
    <div class="cele-sub" id="celeSub"></div>
    <div class="cele-stats" id="celeStats"></div>
    <div class="next-up"><small>NEXT UP</small><b id="celeNext"></b></div>
    <button class="cta ready" id="celeGo">LET'S GO</button>
  </div>
</div>

<script>
/* =====================================================================
   EDIT YOUR WORKOUT PLANS HERE
   ---------------------------------------------------------------------
   PROGRAMS holds every version. Each version is:
   { id, badge, name, desc, tip, rules:[...], days:[ {title, items:[...]} ] }

   Each item (exercise) can use these fields — leave out what you don't need:
     name   : main exercise                       (required)
     opts   : ["swap 1","swap 2","swap 3"]        substitutes
     sets   : "3"      reps: "8–12"
     effort : "1–2 RIR"   rest: "2 min"
     tag    : muscle chip, e.g. "Quads"           (coloured label)
     sub    : small grey line, e.g. "Knee-dominant"
     group  : section header, e.g. "Warm-up"      (a new header shows when it changes)
     notes  : orange line    rule : crowded-gym rule shown under swaps

   To add V3 later: copy a whole version block, change id/badge/name, edit days.
   The app loops Day 1 → … → last day → Day 1, only advancing when you finish.
===================================================================== */
const PROGRAMS = [
  {
    id: "v1", badge: "V1",
    name: "Recomp · Crowded gym",
    desc: "Upper / Lower split + full-body circuit. Warm-up and cardio included.",
    tip: "",
    rules: [
      ["2+ people waiting", "switch to Option 1 immediately."],
      ["Option 1 occupied", "use Option 2."],
      ["High-priority lifts", "only worth waiting for if you're progressing that exact movement."],
      ["Accessories", "never queue, just switch."],
      ["Pain rule", "pain beats the hierarchy — use a pain-free option."],
      ["Progression", "progress whichever variation you actually performed."]
    ],
    days: [
      { title: "Upper A", items: [
        {group:"Warm-up", name:"Treadmill / bike / cross-trainer", sets:"1", reps:"5–8 min", notes:"Easy pace", rule:"Use any available cardio station"},
        {group:"Upper A", name:"Incline DB press", opts:["Incline machine press","Incline Smith press"], sets:"3", reps:"8–10", rest:"2 min", rule:"Use Option 1 immediately if bench/DB setup is occupied"},
        {group:"Upper A", name:"Chest press", opts:["Flat DB press","Bench press"], sets:"2", reps:"8–10", rest:"2 min", rule:"Do not queue for machine"},

const TAG_COLORS = {
  quads:"#FF5C7A", glutes:"#FF8A3D", hamstrings:"#FFB03D", calves:"#F5D547",
  chest:"#3DD6FF", back:"#5C8DFF", biceps:"#B57BFF", triceps:"#E07BFF",
  traps:"#7BFFB0", waist:"#3DFFC8", shoulders:"#FF7BD0", core:"#3DFFC8"
};
const DAY_HUES = [
  ["#FF2E63","#FF8A3D"], ["#7B2CFF","#FF2E90"], ["#FF6A00","#FFB23D"],
  ["#0077FF","#00C2D1"], ["#00A86B","#2DD4BF"], ["#D6246E","#7B2CFF"], ["#E0A800","#FF5C3D"]
];
const KEY = "gymx_state_v3";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- state ---------- */
function freshProg(){ return { day:0, done:{}, sessions:0, full:0, dates:[] }; }
function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s || !s.prog){
    s = { active: DEFAULT_VERSION, prog:{} };
    // carry over progress from the previous app version into V1
    try{
      const old = JSON.parse(localStorage.getItem("gymx_state_v2"));
      if(old && typeof old.dayIndex === "number"){
        s.prog.v1 = freshProg();
        s.prog.v1.day = old.dayIndex;
        s.prog.v1.done = old.completed || {};
      }
    }catch(e){}
  }
  PROGRAMS.forEach(p => { if(!s.prog[p.id]) s.prog[p.id] = freshProg(); });
  if(!PROGRAMS.find(p => p.id === s.active)) s.active = PROGRAMS[0].id;
  return s;
}
let state = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const P  = () => PROGRAMS.find(p => p.id === state.active);
const S  = () => { const s = state.prog[state.active]; if(s.day >= P().days.length) s.day = 0; return s; };
const doneList = (d) => { const s = S(); const k = String(d ?? s.day); if(!s.done[k]) s.done[k] = []; return s.done[k]; };
const pctOf = (d) => { const n = P().days[d].items.length; return n ? Math.round(doneList(d).length / n * 100) : 0; };

/* ---------- render ---------- */
const RING_C = 2 * Math.PI * 36;
$("ringVal").style.strokeDasharray = RING_C;
let shownPct = 0;

function renderAll(){
  const p = P(), s = S(), day = p.days[s.day];
  const [h1, h2] = DAY_HUES[s.day % DAY_HUES.length];
  const hero = $("hero");
  hero.style.setProperty("--h1", h1); hero.style.setProperty("--h2", h2);
  $("heroWm").textContent = String(s.day + 1).padStart(2, "0");
  $("heroKicker").textContent = `DAY ${s.day + 1} OF ${p.days.length}`;
  $("heroTitle").textContent = day.title;
  const totalSets = day.items.reduce((a, x) => a + (parseInt(x.sets) || 0), 0);
  const tags = [...new Set(day.items.map(x => x.tag).filter(Boolean))];
  $("heroSub").textContent = tags.length
    ? `${tags.join(" · ")}`
    : `${day.items.length} exercises · ${totalSets} sets`;
  $("verPill").textContent = p.badge;

  // cycle strip
  const cyc = $("cycle"); cyc.innerHTML = "";
  p.days.forEach((d, i) => {
    const b = document.createElement("button");
    b.className = "cyc" + (i < s.day ? " past" : "") + (i === s.day ? " current" : "");
    const w = i === s.day ? pctOf(i) : (i < s.day ? 100 : 0);
    b.innerHTML = `<b>D${i+1}</b><small>${esc(shortTitle(d.title))}</small><div class="fill" style="width:${w}%"></div>`;
    b.onclick = () => { if(i !== s.day){ s.day = i; save(); swapRender(); } };
    cyc.appendChild(b);
  });

  // stats
  const week = sessionsThisWeek();
  $("stats").innerHTML = `
    <div class="stat">${ICON.flame}<b>${s.sessions}</b> sessions</div>
    <div class="stat">${ICON.loop}Cycle <b>${Math.floor(s.sessions / p.days.length) + 1}</b></div>
    <div class="stat">${ICON.cal}<b>${week}</b> this week</div>`;

  // list
  const list = $("list"); list.innerHTML = "";
  if(p.tip){ const t = document.createElement("div"); t.className = "tip"; t.innerHTML = p.tip; list.appendChild(t); }
  const dl = doneList();
  let lastGroup = null;
  day.items.forEach((ex, i) => {
    if(ex.group && ex.group !== lastGroup){
      const g = document.createElement("div"); g.className = "group"; g.textContent = ex.group; list.appendChild(g);
      lastGroup = ex.group;
    }
    list.appendChild(cardFor(ex, i, dl.includes(i)));
  });

  shownPct = pctOf(s.day);
  updateProgress(false);
}

function shortTitle(t){ const a = t.split(/[\/·]/)[0].trim(); return a.length > 7 ? a.split(" ")[0] : a; }

function cardFor(ex, i, isDone){
  const c = document.createElement("div");
  c.className = "card" + (isDone ? " done" : "");
  c.style.setProperty("--i", i);
  const col = TAG_COLORS[(ex.tag || "").toLowerCase()] || "#FF8A3D";
  const meta = [];
  if(ex.sets && ex.reps) meta.push(`<b>${esc(ex.sets)} × ${esc(ex.reps)}</b>`);
  else if(ex.reps) meta.push(`<b>${esc(ex.reps)}</b>`);
  if(ex.effort) meta.push(esc(ex.effort));
  if(ex.rest) meta.push(`rest ${esc(ex.rest)}`);
  const opts = ex.opts || [];
  c.innerHTML = `
    <div class="check">${String(i+1).padStart(2,"0")}
      <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="body">
      ${ex.tag ? `<span class="chip" style="--c:${col}">${esc(ex.tag)}</span>` : ""}
      <div class="name">${esc(ex.name)}</div>
      ${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}
      ${ex.sub ? `<div class="sub">${esc(ex.sub)}</div>` : ""}
      ${ex.notes ? `<div class="note">${esc(ex.notes)}</div>` : ""}
      ${opts.length ? `
        <button class="opt-btn">${opts.length} swap${opts.length > 1 ? "s" : ""} <span class="car">▾</span></button>
        <div class="opts"><div class="opts-inner">
          ${opts.map((o, k) => `<div class="opt"><span>OPT ${k+1}</span>${esc(o)}</div>`).join("")}
          ${ex.rule ? `<div class="rule">${esc(ex.rule)}</div>` : ""}
        </div></div>` : ""}
    </div>`;
  const btn = c.querySelector(".opt-btn");
  if(btn){
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const box = c.querySelector(".opts");
      const open = btn.classList.toggle("open");
      box.style.maxHeight = open ? box.scrollHeight + "px" : "0px";
    });
  }
  c.addEventListener("click", () => toggle(i, c));
  return c;
}

function toggle(i, card){
  const dl = doneList();
  const pos = dl.indexOf(i);
  if(pos === -1){ dl.push(i); card.classList.add("done", "pop"); setTimeout(() => card.classList.remove("pop"), 460); }
  else { dl.splice(pos, 1); card.classList.remove("done"); }
  save();
  updateProgress(true);
}

function updateProgress(animate){
  const s = S(), p = P(), n = p.days[s.day].items.length, d = doneList().length;
  const pct = n ? Math.round(d / n * 100) : 0;
  $("ringVal").style.strokeDashoffset = RING_C * (1 - pct / 100);
  $("topProg").style.width = pct + "%";
  const fill = $("cycle").children[s.day]?.querySelector(".fill");
  if(fill) fill.style.width = pct + "%";
  countTo(pct, animate);
  if(animate && pct === 100){ const r = $("ring"); r.classList.remove("full"); void r.offsetWidth; r.classList.add("full"); }

  const cta = $("cta");
  const left = n - d;
  cta.classList.toggle("ready", left === 0);
  cta.textContent = left === 0 ? `COMPLETE DAY ${s.day + 1}` : `${left} TO GO`;
  $("skip").style.display = left === 0 ? "none" : "block";
}

let countRaf;
function countTo(target, animate){
  cancelAnimationFrame(countRaf);
  if(!animate){ $("pct").textContent = target + "%"; shownPct = target; return; }
  const from = shownPct, t0 = performance.now(), dur = 450;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), v = Math.round(from + (target - from) * (1 - Math.pow(1 - k, 3)));
    $("pct").textContent = v + "%";
    if(k < 1) countRaf = requestAnimationFrame(step); else shownPct = target;
  };
  countRaf = requestAnimationFrame(step);
}

function swapRender(){
  const app = $("app");
  app.classList.add("swap");
  setTimeout(() => { renderAll(); window.scrollTo({ top:0 }); app.classList.remove("swap"); }, 200);
}

function sessionsThisWeek(){
  const now = new Date(); const monday = new Date(now);
  monday.setHours(0,0,0,0); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  return (S().dates || []).filter(t => t >= monday.getTime()).length;
}

/* ---------- finishing a day ---------- */
function finishDay(){
  const p = P(), s = S(), n = p.days[s.day].items.length;
  const pct = pctOf(s.day);
  const finished = s.day;
  s.sessions += 1;
  if(pct === 100) s.full = (s.full || 0) + 1;
  s.dates = (s.dates || []).concat(Date.now()).slice(-120);
  s.done[String(finished)] = [];                 // clear so the day starts fresh next cycle
  s.day = (finished + 1) % p.days.length;
  save();

  const cycleDone = s.day === 0;
  $("celeNum").textContent = String(finished + 1).padStart(2, "0");
  $("celeTitle").innerHTML = pct === 100 ? `DAY ${finished + 1} <span>CRUSHED</span>` : `DAY ${finished + 1} <span>LOGGED</span>`;
  $("celeSub").textContent = cycleDone
    ? `Full cycle complete. That's ${Math.floor(s.sessions / p.days.length)} cycle${s.sessions / p.days.length >= 2 ? "s" : ""} of ${p.badge} in the bank.`
    : (pct === 100 ? "Every exercise done. Recover well." : `${pct}% done — logged and moving on.`);
  $("celeStats").innerHTML = `
    <div><b>${pct}%</b><small>TODAY</small></div>
    <div><b>${s.sessions}</b><small>SESSIONS</small></div>
    <div><b>${sessionsThisWeek()}</b><small>THIS WEEK</small></div>`;
  $("celeNext").textContent = `Day ${s.day + 1} · ${p.days[s.day].title}`;
  $("celebrate").classList.add("open");
  if(pct === 100) confetti();
}
$("cta").onclick = () => { if(doneList().length === P().days[S().day].items.length) finishDay(); };
$("skip").onclick = () => { if(confirm("Finish this day with some exercises not done?")) finishDay(); };
$("celeGo").onclick = () => { $("celebrate").classList.remove("open"); swapRender(); };

/* ---------- confetti (tiny, no library) ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ["#FF2E63","#FF8A3D","#FFD23D","#FFFFFF","#3DD6FF","#B57BFF"];
  const parts = Array.from({ length: 110 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 60, y: innerHeight * .38,
    vx: (Math.random() - .5) * 11, vy: -Math.random() * 12 - 4,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
    c: cols[(Math.random() * cols.length) | 0]
  }));
  const t0 = performance.now();
  (function tick(now){
    const t = now - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(q => {
      q.vy += .32; q.vx *= .99; q.x += q.vx; q.y += q.vy; q.r += q.vr;
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r);
      ctx.globalAlpha = Math.max(0, 1 - t / 2200);
      ctx.fillStyle = q.c; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h * Math.abs(Math.cos(q.r)));
      ctx.restore();
    });
    if(t < 2200) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ---------- menu sheet ---------- */
function openSheet(){ renderSheet(); $("overlay").classList.add("open"); $("sheet").classList.add("open"); }
function closeSheet(){ $("overlay").classList.remove("open"); $("sheet").classList.remove("open"); }
$("menuBtn").onclick = openSheet;
$("verPill").onclick = openSheet;
$("overlay").onclick = closeSheet;

function renderSheet(){
  const v = $("versions"); v.innerHTML = "";
  PROGRAMS.forEach(p => {
    const st = state.prog[p.id];
    const b = document.createElement("button");
    b.className = "ver" + (p.id === state.active ? " active" : "");
    b.innerHTML = `<div class="ver-badge">${esc(p.badge)}</div>
      <div class="ver-txt"><b>${esc(p.name)}</b><small>${esc(p.desc)}</small>
      <em>${st.sessions} sessions · on Day ${(st.day % p.days.length) + 1} of ${p.days.length}</em></div>`;
    b.onclick = () => {
      if(p.id === state.active){ closeSheet(); return; }
      state.active = p.id; save(); closeSheet(); swapRender();
    };
    v.appendChild(b);
  });
  $("rules").innerHTML = P().rules.map(([k, t]) => `<div><b>${esc(k)}</b> — ${esc(t)}</div>`).join("");
  $("resetBtn").textContent = `Reset ${P().badge} progress`;
}
$("resetBtn").onclick = () => {
  if(confirm(`Reset all ${P().badge} progress (day, checkmarks, session count)? Other versions are untouched.`)){
    state.prog[state.active] = freshProg(); save(); closeSheet(); swapRender();
  }
};
