<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymX">
<meta name="theme-color" content="#050709">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>GymX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050709; --surface:#0D1216; --surface-2:#141B21; --surface-3:#1B242C;
    --border:#1E2930; --border-2:#2A3942;
    --text:#F2FBFF; --muted:#A2B6C0; --faint:#62757F;
    --accent:#00E5FF; --accent-2:#0096FF; --on-accent:#00161C;
    --soft:#8EF3FF;
    --grad:linear-gradient(135deg,#00F0FF,#0096FF);
    --radius:18px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--text);}
  body{
    font-family:'Inter',-apple-system,'Helvetica Neue',sans-serif; font-size:16px;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit; cursor:pointer; color:inherit;}
  .display{font-family:'Oswald','Arial Narrow',sans-serif; font-weight:700; letter-spacing:.3px;}
  .noselect{-webkit-user-select:none; user-select:none;}

  /* ---------- sticky top bar ---------- */
  .top{
    position:sticky; top:0; z-index:20;
    padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;
    background:rgba(5,7,9,.86); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border-bottom:1px solid transparent; transition:border-color .3s;
  }
  .top.scrolled{border-bottom-color:var(--border);}
  .top-row{display:flex; align-items:center; gap:12px; height:44px;}
  .logo{width:36px; height:36px; flex-shrink:0;}
  .top-mid{flex:1; min-width:0; position:relative; height:44px;}
  .top-mid > div{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; transition:opacity .25s, transform .25s var(--ease);}
  .wordmark{font-size:23px; letter-spacing:2px;}
  .wordmark span{color:var(--accent);}
  .mini-day{opacity:0; transform:translateY(8px);}
  .top.scrolled .brand{opacity:0; transform:translateY(-8px);}
  .top.scrolled .mini-day{opacity:1; transform:none;}
  .mini-day b{font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mini-day small{font-size:13px; color:var(--muted); font-weight:600;}
  .mini-day small em{font-style:normal; color:var(--accent);}
  .mini-ring{position:relative; width:46px; height:46px; flex-shrink:0;}
  .mini-ring svg{width:46px; height:46px; transform:rotate(-90deg);}
  .mini-ring .track{stroke:var(--surface-3);}
  .mini-ring .val{stroke:var(--accent); transition:stroke-dashoffset .6s var(--ease);}
  .mini-ring b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800;}
  .icon-btn{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--border); background:var(--surface);
    font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .top-prog{position:absolute; left:0; right:0; bottom:-1px; height:3px;}
  .top-prog i{display:block; height:100%; width:0; background:var(--grad); transition:width .5s var(--ease); box-shadow:0 0 12px var(--accent);}

  /* ---------- hero ---------- */
  .hero{
    margin:8px 16px 0; border-radius:26px; position:relative; overflow:hidden;
    padding:22px 20px 20px; min-height:190px;
    background:linear-gradient(135deg,var(--h1),var(--h2));
    display:flex; flex-direction:column; justify-content:flex-end;
    box-shadow:0 22px 50px -24px var(--h1);
  }
  .hero::before{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.28),transparent 55%),radial-gradient(100% 90% at 0% 100%,rgba(0,0,0,.45),transparent 60%);}
  .hero-wm{position:absolute; right:-4px; top:-30px; font-family:'Oswald',sans-serif; font-weight:700; font-size:170px; line-height:1; color:rgba(255,255,255,.14); pointer-events:none;}
  .hero-row > div:first-child{flex:1; min-width:0;}
  .hero-row{position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:14px;}
  .hero-kicker{font-size:13px; font-weight:800; letter-spacing:2px; color:rgba(0,10,14,.75);}
  .hero-title{font-size:38px; overflow-wrap:anywhere; line-height:1; margin:6px 0 4px; color:#00121A; text-transform:uppercase;}
  .hero-focus{font-size:16px; font-weight:700; color:rgba(0,16,22,.8);}
  .ring{position:relative; width:96px; height:96px; flex-shrink:0;}
  .ring svg{width:96px; height:96px; transform:rotate(-90deg);}
  .ring .track{stroke:rgba(0,20,28,.22);}
  .ring .val{stroke:#00121A; transition:stroke-dashoffset .7s var(--ease);}
  .ring-c{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#00121A;}
  .ring-c b{font-family:'Oswald',sans-serif; font-size:27px; line-height:1;}
  .ring-c small{font-size:10px; font-weight:800; letter-spacing:1.2px; margin-top:2px;}
  .ring.full{animation:ringPop .6s var(--ease);}
  @keyframes ringPop{40%{transform:scale(1.12)}}
  .hero-stats{position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px;}
  .hero-stats div{background:rgba(0,18,26,.2); border-radius:14px; padding:9px 10px;}
  .hero-stats b{display:block; font-family:'Oswald',sans-serif; font-size:21px; color:#00121A; line-height:1.1;}
  .hero-stats small{font-size:11px; font-weight:800; letter-spacing:.8px; color:rgba(0,16,22,.72);}

  /* ---------- day strip ---------- */
  .cycle{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding:14px 16px 2px;}
  .cyc{border-radius:14px; background:var(--surface); border:1px solid var(--border); padding:10px 2px 9px; text-align:center; position:relative; overflow:hidden; transition:transform .2s var(--ease), border-color .2s;}
  .cyc:active{transform:scale(.94);}
  .cyc b{display:block; font-family:'Oswald',sans-serif; font-size:18px; color:var(--muted);}
  .cyc small{display:block; font-size:11px; color:var(--faint); font-weight:700; margin-top:1px;}
  .cyc .fill{position:absolute; left:0; bottom:0; height:3px; background:var(--grad);}
  .cyc.past b,.cyc.current b{color:var(--text);}
  .cyc.current{border-color:var(--accent); background:var(--surface-2); box-shadow:0 0 0 3px rgba(0,229,255,.12);}
  .cyc.current small{color:var(--accent);}

  /* ---------- banners ---------- */
  main{padding:6px 16px 170px;}
  .banner{margin:14px 0 4px; padding:14px 16px; border-radius:16px; background:var(--surface); border:1px solid var(--border); font-size:15px; line-height:1.5; color:var(--muted);}
  .banner b{color:var(--text);}
  .banner.week{background:linear-gradient(135deg,rgba(0,229,255,.13),rgba(0,150,255,.06)); border-color:rgba(0,229,255,.35); color:#CFF8FF;}
  .banner.week b{color:var(--accent);}
  .banner summary{list-style:none; display:flex; justify-content:space-between; align-items:center; font-weight:700; color:var(--text);}
  .banner summary::-webkit-details-marker{display:none;}
  .banner summary span{color:var(--accent); font-size:14px;}
  .banner ul{margin:10px 0 0; padding-left:18px;}
  .banner li{margin-bottom:6px;}

  /* ---------- exercise card ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    margin-top:12px; overflow:hidden;
    transition:border-color .3s, background .3s, opacity .3s;
    animation:fadeUp .45s var(--ease) both; animation-delay:calc(var(--i) * 45ms);
  }
  @keyframes fadeUp{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
  .card.done{background:#0A0F12; border-color:rgba(0,229,255,.35);}
  .card-head{display:grid; grid-template-columns:52px 1fr auto; gap:14px; align-items:start; padding:16px 16px 12px;}
  .check{
    width:52px; height:52px; border-radius:50%; border:2px solid var(--border-2); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; position:relative;
    font-family:'Oswald',sans-serif; font-size:19px; color:var(--muted);
    transition:background .25s, border-color .25s, transform .15s;
  }
  .check:active{transform:scale(.9);}
  .check svg{position:absolute; width:24px; height:24px; opacity:0;}
  .check svg path{stroke-dasharray:24; stroke-dashoffset:24;}
  .card.done .check{background:var(--grad); border-color:transparent; color:transparent; box-shadow:0 6px 20px -6px var(--accent);}
  .card.done .check svg{opacity:1;}
  .card.done .check svg path{animation:draw .35s .05s var(--ease) forwards;}
  .card.pop .check{animation:pop .45s var(--ease);}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{35%{transform:scale(1.25)}}
  .mid{min-width:0;}
  .chip{display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:1px; padding:4px 9px; border-radius:7px; text-transform:uppercase; color:var(--c); background:color-mix(in srgb,var(--c) 15%,transparent);}
  .sub{font-size:13.5px; color:var(--faint); margin-top:6px; font-weight:600;}
  .name{font-size:20px; font-weight:800; line-height:1.25; margin-top:5px;}
  .card.done .name{color:var(--muted);}
  .rx{text-align:right; padding-top:2px;}
  .rx b{display:block; font-family:'Oswald',sans-serif; font-size:30px; line-height:1; color:var(--text);}
  .rx b span{color:var(--accent); font-size:20px; margin-left:1px;}
  .rx small{display:block; font-size:13px; color:var(--muted); font-weight:700; margin-top:4px; white-space:nowrap;}
  .card-meta{display:flex; flex-wrap:wrap; gap:8px; padding:0 16px;}
  .pill{font-size:13.5px; font-weight:600; color:var(--muted); background:var(--surface-2); border:1px solid var(--border); padding:6px 11px; border-radius:20px;}
  .pill.go{color:var(--on-accent); background:var(--accent); border-color:var(--accent); font-weight:800;}
  .pill.hold{color:#CFF8FF; border-color:rgba(0,229,255,.3);}
  .pill.deload{color:#FFD58A; border-color:rgba(255,200,90,.35); background:rgba(255,200,90,.08);}
  .note{margin:10px 16px 0; font-size:14.5px; color:var(--soft); line-height:1.45;}
  .last{margin:10px 16px 0; font-size:14px; color:var(--muted); line-height:1.45;}
  .last b{color:var(--text);}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 16px 16px;}
  .act{padding:14px 10px; border-radius:14px; border:1px solid var(--border-2); background:var(--surface-2); font-size:15.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .15s, background .2s, border-color .2s;}
  .act:active{transform:scale(.97);}
  .act.on{border-color:var(--accent); color:var(--accent); background:rgba(0,229,255,.08);}
  .act .car{display:inline-block; transition:transform .25s var(--ease);}
  .act.on .car{transform:rotate(180deg);}
  .act .vol{color:var(--accent); font-weight:800;}

  .panel{max-height:0; overflow:hidden; transition:max-height .35s var(--ease);}
  .panel-in{padding:0 16px 16px;}
  .lbl{font-size:12px; font-weight:800; letter-spacing:1.4px; color:var(--faint); margin:4px 0 8px;}
  .vars{display:grid; gap:8px; margin-bottom:14px;}
  .var{text-align:left; padding:13px 14px; border-radius:13px; border:1.5px solid var(--border-2); background:var(--surface-2); font-size:15.5px; font-weight:600; display:flex; align-items:center; gap:11px;}
  .var i{font-style:normal; font-size:11px; font-weight:800; color:var(--faint); border:1px solid var(--border-2); border-radius:6px; padding:2px 6px; flex-shrink:0; letter-spacing:.5px;}
  .var.sel{border-color:var(--accent); background:rgba(0,229,255,.09); color:var(--text);}
  .var.sel i{color:var(--on-accent); background:var(--accent); border-color:var(--accent);}
  .sets-head, .set-row{display:grid; grid-template-columns:42px 1fr 1fr 78px; gap:9px; align-items:center;}
  .sets-head{font-size:12px; font-weight:800; letter-spacing:1px; color:var(--faint); margin-bottom:6px;}
  .sets-head span:last-child{text-align:right;}
  .set-row{margin-bottom:8px;}
  .set-no{font-family:'Oswald',sans-serif; font-size:20px; color:var(--muted); text-align:center;}
  .set-row.filled .set-no{color:var(--accent);}
  .set-row input{
    width:100%; height:52px; border-radius:13px; border:1.5px solid var(--border-2); background:var(--bg);
    color:var(--text); font-size:20px; font-weight:700; text-align:center; font-family:inherit;
    -webkit-appearance:none; appearance:none; outline:none; transition:border-color .2s, box-shadow .2s;
  }
  .set-row input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,229,255,.18);}
  .set-row input::placeholder{color:#3F525C; font-weight:600;}
  .set-prev{font-size:13px; color:var(--faint); text-align:right; font-weight:600;}
  .rir{display:flex; gap:8px; margin:12px 0 4px;}
  .rir button{flex:1; height:46px; border-radius:12px; border:1.5px solid var(--border-2); background:var(--surface-2); font-size:17px; font-weight:800; color:var(--muted);}
  .rir button.sel{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  .ex-vol{display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding:12px 14px; border-radius:13px; background:var(--bg); border:1px solid var(--border);}
  .ex-vol small{font-size:13px; color:var(--muted); font-weight:700;}
  .ex-vol b{font-family:'Oswald',sans-serif; font-size:22px; color:var(--accent);}
  .ex-vol em{font-style:normal; font-size:13px; font-weight:700; margin-left:8px;}
  .up{color:#5CFFB0;} .down{color:#FF8A8A;}
  .swap-list .opt{display:flex; gap:12px; align-items:center; padding:13px 0; border-top:1px solid var(--border); font-size:16px;}
  .swap-list .opt:first-child{border-top:none;}
  .swap-list .opt span{font-family:'Oswald',sans-serif; font-size:13px; color:var(--accent); border:1px solid rgba(0,229,255,.4); border-radius:7px; padding:2px 8px; flex-shrink:0;}
  .swap-rule{font-size:14px; color:var(--muted); margin-top:6px; line-height:1.45;}

  /* ---------- footer ---------- */
  footer{position:fixed; left:0; right:0; bottom:0; z-index:15; padding:16px 16px calc(env(safe-area-inset-bottom) + 12px); background:linear-gradient(to top,var(--bg) 72%,rgba(5,7,9,0)); transition:transform .3s var(--ease), opacity .3s;}
  body.typing footer{transform:translateY(120%); opacity:0;}
  .cta{width:100%; padding:19px; border:none; border-radius:18px; font-family:'Oswald',sans-serif; font-size:19px; font-weight:600; letter-spacing:1px; background:var(--surface-3); color:var(--muted); position:relative; overflow:hidden; transition:transform .15s, background .3s;}
  .cta:active{transform:scale(.97);}
  .cta.ready{background:var(--grad); color:var(--on-accent); animation:glow 1.8s ease-in-out infinite;}
  .cta.ready::after{content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); transform:skewX(-20deg); animation:shine 2.4s ease-in-out infinite;}
  @keyframes glow{50%{box-shadow:0 10px 38px -6px var(--accent)}}
  @keyframes shine{0%{left:-60%}60%,100%{left:130%}}
  .skip{display:block; width:100%; margin-top:8px; padding:6px; background:none; border:none; font-size:14px; color:var(--faint);}

  /* ---------- sheet ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.62); opacity:0; pointer-events:none; transition:opacity .25s; z-index:30;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:31; background:#0B1014; border-top:1px solid var(--border); border-radius:26px 26px 0 0; padding:10px 18px calc(env(safe-area-inset-bottom) + 24px); transform:translateY(105%); transition:transform .35s var(--ease); max-height:88vh; overflow-y:auto;}
  .sheet.open{transform:none;}
  .grab{width:44px; height:5px; border-radius:3px; background:var(--border-2); margin:0 auto 14px;}
  .sheet h3{margin:22px 0 10px; font-size:13px; font-weight:800; letter-spacing:1.8px; color:var(--faint);}
  .sheet h3:first-of-type{margin-top:4px;}
  .plan-card{padding:16px; border-radius:18px; background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(0,150,255,.05)); border:1px solid rgba(0,229,255,.3);}
  .plan-card b{display:block; font-size:18px;}
  .plan-card small{display:block; font-size:14px; color:var(--muted); margin-top:4px; line-height:1.45;}
  .sheet-btn{width:100%; text-align:left; padding:16px; border-radius:16px; border:1px solid var(--border-2); background:var(--surface); margin-bottom:10px; display:flex; align-items:center; gap:14px; font-size:16px; font-weight:700;}
  .sheet-btn:active{transform:scale(.98);}
  .sheet-btn svg{width:24px; height:24px; flex-shrink:0;}
  .sheet-btn small{display:block; font-size:13px; font-weight:500; color:var(--muted); margin-top:3px;}
  .rules div{font-size:15px; color:var(--muted); line-height:1.5; margin-bottom:11px;}
  .rules b{color:var(--text);}
  .danger{width:100%; margin-top:8px; padding:15px; border-radius:16px; border:1px solid rgba(255,90,90,.35); background:rgba(255,90,90,.08); color:#FF8A8A; font-size:15.5px; font-weight:700;}

  /* ---------- celebration ---------- */
  .celebrate{position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:rgba(3,5,7,.92); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .3s; padding:24px;}
  .celebrate.open{opacity:1; pointer-events:auto;}
  #confetti{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .cele{position:relative; text-align:center; width:100%; max-width:380px; transform:scale(.92); transition:transform .45s var(--ease);}
  .celebrate.open .cele{transform:none;}
  .medal{width:116px; height:116px; margin:0 auto 18px; border-radius:50%; background:var(--grad); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 12px rgba(0,229,255,.1),0 20px 60px -10px var(--accent); animation:medal 1.3s var(--ease);}
  .medal b{font-family:'Oswald',sans-serif; font-size:38px; color:var(--on-accent);}
  @keyframes medal{0%{transform:scale(.3) rotate(-30deg); opacity:0}60%{transform:scale(1.1) rotate(6deg); opacity:1}100%{transform:none}}
  .cele-title{font-size:38px; line-height:1.05; text-transform:uppercase;}
  .cele-title span{color:var(--accent);}
  .cele-sub{color:var(--muted); font-size:16px; margin:10px 0 18px; line-height:1.45;}
  .cele-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
  .cele-stats div{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px 6px;}
  .cele-stats b{display:block; font-family:'Oswald',sans-serif; font-size:23px;}
  .cele-stats small{font-size:11px; color:var(--faint); font-weight:800; letter-spacing:1px;}
  .next-up{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:14px; text-align:left;}
  .next-up small{font-size:12px; color:var(--faint); font-weight:800; letter-spacing:1.5px;}
  .next-up b{display:block; font-size:18px; margin-top:4px;}
  .next-up em{display:block; font-style:normal; font-size:14px; color:var(--accent); margin-top:4px; font-weight:600;}

  .toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 110px); transform:translate(-50%,20px); background:var(--surface-3); border:1px solid var(--border-2); color:var(--text); padding:12px 18px; border-radius:30px; font-size:14.5px; font-weight:700; opacity:0; transition:opacity .25s, transform .25s var(--ease); z-index:50; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1; transform:translate(-50%,0);}

  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<div class="top noselect" id="top">
  <div class="top-row">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#0096FF"/></linearGradient>

<script>
/* =====================================================================
   EDIT YOUR WORKOUT PLAN HERE
   ---------------------------------------------------------------------
   Each day: { title, focus, restAfter, items:[...] }
   restAfter: true shows "Rest day next" after finishing that day.
   Each exercise:
     tag   : muscle chip            sub : head / region
     name  : primary exercise       opts: ["Option 1","Option 2","Option 3"]
     sets  : number (e.g. 3)        lo / hi : rep range (8 / 12)
     rir   : "1–2"                  rest : "2 min"
     notes : coaching note (optional)
   Changing exercises keeps your old logs; logs are matched by
   day + position + exercise name.
===================================================================== */
const PLAN = {
  name: "Recomp Plan v1",
  weeks: 8, deloadWeek: 7,
  days: [
    { title:"Lower A", focus:"Quad focus", restAfter:false, items:[
      {tag:"Quads", sub:"Vastus group", name:"Hack Squat", opts:["Leg Press (feet mid)","Smith Squat (heels slightly forward)","Goblet Squat"], sets:4, lo:8, hi:12, rir:"1–2", rest:"2–3 min", notes:"Controlled depth you tolerate on the day; knee flare → drop to Leg Press"},
      {tag:"Quads", sub:"Rectus femoris + vasti", name:"Leg Extension", opts:["Heel-Elevated Goblet Squat","Smith Squat (narrow, heels forward)","Leg Press (feet low)"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1.5 min", notes:"Pause 1 s at top"},
      {tag:"Hamstrings", sub:"Biceps femoris / semis", name:"Seated Leg Curl", opts:["Lying Leg Curl","DB Leg Curl (bench)","Stability-Ball / Slider Curl"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1.5 min"},
      {tag:"Calves", sub:"Gastrocnemius", name:"Standing Calf Raise", opts:["Smith Calf Raise","Leg Press Calf Raise","Single-Leg DB Calf Raise (step)"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1 min", notes:"Full stretch at bottom, 1 s pause"},
      {tag:"Core", sub:"Obliques / deep core", name:"Pallof Press (cable or band)", opts:["Side Plank","Dead Bug","Machine Ab Crunch"], sets:2, lo:10, hi:12, rir:"1–2", rest:"1 min", notes:"Reps per side"}
    ]},
    { title:"Upper A", focus:"Chest focus", restAfter:true, items:[
      {tag:"Chest", sub:"Upper (clavicular)", name:"Low-Incline DB Press (15–30°, neutral/semi grip)", opts:["Low-Incline Smith Press","Incline Machine Press (if free)","Low-to-High Cable Press"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2–3 min", notes:"Pick the angle/grip that stays at your usual shoulder baseline"},
      {tag:"Back", sub:"Lats", name:"Neutral-Grip Lat Pulldown", opts:["Assisted Neutral Pull-Up","Single-Arm Cable Pulldown","Chest-Supported DB Row (elbows to hip)"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2 min"},
      {tag:"Chest", sub:"Mid (sternal)", name:"Machine Chest Press (neutral grip)", opts:["Neutral-Grip DB Press (flat)","Smith Flat Press (moderate grip)","Push-Up"], sets:2, lo:8, hi:12, rir:"1–2", rest:"2 min", notes:"Your best-tolerated press so far"},
      {tag:"Back", sub:"Mid-back / rhomboids / mid traps", name:"Chest-Supported DB Row (incline bench)", opts:["Machine Row","Seated Cable Row (neutral)","One-Arm DB Row"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2 min", notes:"Bench-only primary = crowd-proof"},
      {tag:"Side delts", sub:"Abduction", name:"DB Lateral Raise (to ~shoulder height)", opts:["Single-Arm Cable Lateral Raise","Lean-Away DB Lateral Raise","Chest-Supported Y-Raise (incline bench)"], sets:3, lo:12, hi:20, rir:"1–2", rest:"1–1.5 min", notes:"Strict, no swing; stop at shoulder height"},
      {tag:"Triceps", sub:"Lateral + medial heads", name:"Cable Pressdown (rope or bar)", opts:["Single-Arm Cable Pressdown","DB Kickback","Lying DB Triceps Extension"], sets:2, lo:10, hi:15, rir:"1–2", rest:"1 min"}
    ]},
    { title:"Lower B", focus:"Glute / Ham focus", restAfter:false, items:[
      {tag:"Glutes/Hams", sub:"Glute max + hamstrings", name:"DB Romanian Deadlift", opts:["Barbell RDL","Smith RDL","Cable Pull-Through"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2–3 min", notes:"Hips back, neutral spine, stretch hamstrings"},
      {tag:"Quads", sub:"Vastus group + glutes", name:"Leg Press (feet mid-high)", opts:["Hack Squat","Smith Squat","Goblet Squat"], sets:3, lo:10, hi:15, rir:"1–2", rest:"2 min", notes:"Full ROM you tolerate"},
      {tag:"Glutes", sub:"Glute max", name:"Smith Hip Thrust", opts:["Barbell Hip Thrust","DB Hip Thrust / Glute Bridge","Cable Pull-Through"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2 min", notes:"1 s squeeze at top"},
      {tag:"Hamstrings", sub:"Biceps femoris / semis", name:"Lying Leg Curl", opts:["Seated Leg Curl","DB Leg Curl (bench)","Stability-Ball / Slider Curl"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1.5 min"},
      {tag:"Glutes", sub:"Glute med / min", name:"Hip Abduction Machine (if available)", opts:["Cable Hip Abduction","Banded Seated Abduction","Side-Lying Hip Abduction"], sets:2, lo:12, hi:20, rir:"1–2", rest:"1 min"},
      {tag:"Calves", sub:"Soleus", name:"Seated Calf Raise", opts:["Leg Press Calf Raise","Bent-Knee DB Calf Raise","Single-Leg Calf Raise"], sets:2, lo:10, hi:15, rir:"1–2", rest:"1 min"}
    ]},
    { title:"Upper B", focus:"Back focus", restAfter:true, items:[
      {tag:"Back", sub:"Lats", name:"Lat Pulldown (least-irritating grip)", opts:["Assisted Pull-Up","Single-Arm Cable Pulldown","Chest-Supported DB Row (elbows to hip)"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2 min"},
      {tag:"Back", sub:"Upper back / traps / lats", name:"One-Arm DB Row (bench)", opts:["Seated Cable Row","Machine Row","Chest-Supported DB Row"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2 min", notes:"Replaces direct shrugs — rows cover traps"},
      {tag:"Chest", sub:"Mid (sternal)", name:"Pec Deck Fly", opts:["Cable Fly (mid height)","Flat DB Fly (limited stretch)","Machine Chest Press"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1.5 min", notes:"Stop the stretch where shoulder stays comfortable"},
      {tag:"Rear delts", sub:"Horizontal abduction", name:"Reverse Pec Deck", opts:["Cable Face Pull (rope)","Chest-Supported DB Rear-Delt Raise","Bent-Over DB Rear-Delt Raise"], sets:3, lo:12, hi:20, rir:"1–2", rest:"1 min", notes:"Same machine as fly — back-to-back sets optional, not a superset requirement"},
      {tag:"Biceps", sub:"Long + short heads", name:"DB Curl (supinated)", opts:["Cable Curl","Preacher Curl","EZ-Bar Curl"], sets:3, lo:8, hi:12, rir:"1–2", rest:"1–1.5 min"}
    ]},
    { title:"Upper C + Glutes", focus:"Delts / Arms", restAfter:false, items:[
      {tag:"Glutes", sub:"Glute max", name:"Barbell / DB Hip Thrust (bench)", opts:["Smith Hip Thrust","DB Glute Bridge (floor)","Cable Pull-Through"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2 min", notes:"Done first because glutes are priority #1"},
      {tag:"Chest", sub:"Upper (clavicular)", name:"Low-Incline Smith Press", opts:["Low-Incline DB Press (neutral)","Machine Chest Press","Low-to-High Cable Press"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2–3 min"},
      {tag:"Side delts", sub:"Abduction", name:"Single-Arm Cable Lateral Raise", opts:["DB Lateral Raise","Lean-Away DB Lateral Raise","Chest-Supported Y-Raise"], sets:3, lo:12, hi:20, rir:"1–2", rest:"1–1.5 min", notes:"Cable version differs from Day 2 on purpose"},
      {tag:"Biceps", sub:"Brachialis / brachioradialis + biceps", name:"DB Hammer Curl", opts:["Rope Hammer Curl","Cross-Body Hammer Curl","EZ-Bar Reverse Curl"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1–1.5 min"},
      {tag:"Triceps", sub:"Long head", name:"Seated DB Overhead Extension (two hands)", opts:["Cable Overhead Extension","Lying DB Extension (incline bench)","Cross-Body Cable Extension"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1–1.5 min", notes:"If overhead position bothers the shoulder, go straight to option 2 or 3"}
    ]}
  ],
  session: [
    "<b>Warm-up ~8–10 min</b> — 5 min bike or incline walk + 2 light ramp-up sets of the first exercise (don't log these).",
    "<b>Lifting ~50–60 min</b> — no supersets or circuits; rest as shown on each card.",
    "<b>Cardio 10–15 min (optional)</b> — easy bike/incline walk. If taken, walk outside — counts toward your 7–8k steps.",
    "<b>Cool-down ~5 min</b> — hip flexors, quads, pecs, lats."
  ],
  weekNotes: {
    1: "<b>Week 1:</b> 2–3 RIR on every set. Many exercises are new — find loads and setups.",
    2: "<b>Weeks 2–6:</b> 1–2 RIR. Last set of isolation exercises may go to 0–1 RIR.",
    7: "<b>Week 7 — deload:</b> same exercises and loads, drop 1 set per exercise, ~3–4 RIR.",
    8: "<b>Week 8:</b> back to normal. Repeat BCA (morning, before food, same device) and tape measurements."
  },
  rules: [
    ["One exercise per target", "Primary busy → Option 1 → Option 2 → Option 3. Take the first free one. Never wait, never reserve."],
    ["Double progression", "All prescribed sets reach the top of the rep range at target RIR → add the smallest load step next session. Otherwise keep the load and add reps."],
    ["Missed a day", "Do the next Day number. Never skip ahead or double up."],
    ["Weekly pattern", "Day 1 → Day 2 → Rest → Day 3 → Day 4 → Rest → Day 5."],
    ["Shoulder / knee", "New variant: first set light. If pain rises above your usual baseline or hasn't settled by the next day → switch to the next option. No mandatory heavy overhead pressing."],
    ["Logging", "Log the exercise you actually did, with kg and reps. Ramp-up sets are not logged."]
  ]
};
/* =================== DO NOT EDIT BELOW THIS LINE ==================== */

const TAG_COLORS = {
  "quads":"#4DE3FF","glutes":"#5CFFB0","glutes/hams":"#7CFFD4","hamstrings":"#8AB4FF","calves":"#C4A8FF",
  "chest":"#FF9ECF","back":"#FFC76B","side delts":"#FF8A8A","rear delts":"#FFA98A","biceps":"#B8FF6B","triceps":"#FFE36B","core":"#9EE7FF"
};
const HUES = [["#00F0FF","#0080FF"],["#00E0C0","#00A3FF"],["#3DDCFF","#5B6CFF"],["#00C8E0","#0060D0"],["#40FFD8","#0096FF"]];
const KEY = "gymx_state_v4";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Math.round(n).toLocaleString("en-IN");
const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : 0; };

/* ---------- state ---------- */
function fresh(){ return { day:0, sessions:0, done:{}, cur:{}, hist:[], dayVol:[], dates:[] }; }
function load(){
  let s = null; try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  s = Object.assign(fresh(), s || {});
  if(s.day >= PLAN.days.length) s.day = 0;
  return s;
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Storage full — export a backup"); } }

const week = () => Math.floor(S.sessions / PLAN.days.length) + 1;
const isDeload = () => week() === PLAN.deloadWeek;
const setsFor = ex => isDeload() ? Math.max(1, ex.sets - 1) : ex.sets;
const doneList = d => { const k = String(d ?? S.day); return S.done[k] || (S.done[k] = []); };
const curFor = (d, i) => {
  const k = String(d); S.cur[k] = S.cur[k] || {};
  if(!S.cur[k][i]){
    // start with the variation you used last time for this slot
    const ex = PLAN.days[d].items[i], names = [ex.name, ...ex.opts];
    let v = 0; for(let j = S.hist.length - 1; j >= 0; j--){ const x = S.hist[j]; if(x.day === d && x.order === i + 1){ v = Math.max(0, names.indexOf(x.ex)); break; } }
    S.cur[k][i] = { v, sets:[], rir:null };
  }
  return S.cur[k][i];
};
const varName = (ex, v) => v === 0 ? ex.name : ex.opts[v - 1];
const lastEntry = (d, i, name) => { for(let k = S.hist.length - 1; k >= 0; k--){ const h = S.hist[k]; if(h.day === d && h.order === i + 1 && h.ex === name) return h; } return null; };
const entryVol = sets => sets.reduce((a, s) => a + num(s.kg) * num(s.reps), 0);
const filledSets = sets => sets.filter(s => num(s.reps) > 0);

function hintFor(ex, last){
  if(isDeload()) return { cls:"deload", txt:"Deload · hold load, −1 set" };
  if(!last) return null;
  const f = filledSets(last.sets);
  if(f.length >= ex.sets && f.slice(0, ex.sets).every(s => num(s.reps) >= ex.hi)) return { cls:"go", txt:"↑ Add load today" };
  return { cls:"hold", txt:"Keep load, add reps" };
}
function nextSessionText(ex, sets){
  const f = filledSets(sets);
  if(!f.length) return "";
  return f.length >= ex.sets && f.slice(0, ex.sets).every(s => num(s.reps) >= ex.hi) ? "Add load" : "Keep load, add reps";
}

/* ---------- rendering ---------- */
const RING = 2 * Math.PI * 41, MINI = 2 * Math.PI * 19;
$("ringVal").style.strokeDasharray = RING; $("miniVal").style.strokeDasharray = MINI;
const openPanels = new Map();   // card index -> "log" | "swap"

function renderAll(){
  const d = S.day, day = PLAN.days[d], [h1, h2] = HUES[d % HUES.length];
  $("hero").style.setProperty("--h1", h1); $("hero").style.setProperty("--h2", h2);
  $("heroWm").textContent = String(d + 1).padStart(2, "0");
  $("heroKicker").textContent = `DAY ${d + 1} OF ${PLAN.days.length}${isDeload() ? " · DELOAD" : ""}`;
  $("heroTitle").textContent = day.title;
  $("heroFocus").textContent = day.focus;
  $("hsWeek").textContent = `${week()}/${PLAN.weeks}`;
  $("miniTitle").textContent = `Day ${d + 1} · ${day.title}`;

  const cyc = $("cycle"); cyc.innerHTML = "";
  PLAN.days.forEach((x, i) => {
    const b = document.createElement("button");
    b.className = "cyc" + (i < d ? " past" : "") + (i === d ? " current" : "");
    b.innerHTML = `<b>D${i + 1}</b><small>${esc(x.title.split(" ")[0] + (x.title.split(" ")[1] ? " " + x.title.split(" ")[1] : ""))}</small><div class="fill" style="width:${i < d ? 100 : 0}%"></div>`;
    b.onclick = () => { if(i !== d){ S.day = i; save(); openPanels.clear(); swapRender(); } };
    cyc.appendChild(b);
  });

  const list = $("list"); list.innerHTML = "";
  const wk = week(), wn = PLAN.weekNotes[wk] || (wk >= 2 && wk <= 6 ? PLAN.weekNotes[2] : "");
  if(wn){ const b = document.createElement("div"); b.className = "banner week"; b.innerHTML = wn; list.appendChild(b); }
  const g = document.createElement("details"); g.className = "banner";
  g.innerHTML = `<summary>Session guide · ≤90 min <span>show</span></summary><ul>${PLAN.session.map(x => `<li>${x}</li>`).join("")}</ul>`;
  g.addEventListener("toggle", () => g.querySelector("summary span").textContent = g.open ? "hide" : "show");
  list.appendChild(g);

  day.items.forEach((ex, i) => list.appendChild(buildCard(ex, i)));
  refreshStats(false);
}

function buildCard(ex, i){
  const d = S.day, c = document.createElement("div");
  const done = doneList().includes(i);
  c.className = "card" + (done ? " done" : ""); c.style.setProperty("--i", i); c.dataset.i = i;
  const col = TAG_COLORS[ex.tag.toLowerCase()] || "#4DE3FF";
  const cur = curFor(d, i), vname = varName(ex, cur.v), last = lastEntry(d, i, vname);
  const hint = hintFor(ex, last), n = setsFor(ex);
  const lastTxt = last ? filledSets(last.sets).map(s => `${num(s.kg) || 0}×${num(s.reps)}`).join(", ") : "";
  c.innerHTML = `
    <div class="card-head">
      <button class="check noselect" aria-label="Mark done">${String(i + 1).padStart(2, "0")}
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#00161C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="mid">
        <span class="chip" style="--c:${col}">${esc(ex.tag)}</span>
        <div class="name">${esc(vname)}</div>
        <div class="sub">${esc(ex.sub)}</div>
      </div>
      <div class="rx"><b>${n}<span>×</span></b><small>${ex.lo}–${ex.hi} reps</small></div>
    </div>
    <div class="card-meta">
      <span class="pill">RIR ${esc(isDeload() ? "3–4" : (week() === 1 ? "2–3" : ex.rir))}</span>
      <span class="pill">Rest ${esc(ex.rest)}</span>
      ${hint ? `<span class="pill ${hint.cls}">${hint.txt}</span>` : ""}
    </div>
    ${ex.notes ? `<div class="note">${esc(ex.notes)}</div>` : ""}
    ${last ? `<div class="last">Last time: <b>${esc(lastTxt)}</b> · ${fmt(entryVol(last.sets))} kg</div>` : ""}
    <div class="actions noselect">
      <button class="act" data-p="log">Log sets <span class="vol" data-vol></span></button>
      <button class="act" data-p="swap">${ex.opts.length} swaps <span class="car">▾</span></button>
    </div>
    <div class="panel"><div class="panel-in"></div></div>`;

  c.querySelector(".check").onclick = () => toggleDone(i, c, true);
  c.querySelectorAll(".act").forEach(b => b.onclick = () => togglePanel(c, ex, i, b.dataset.p));
  updateCardVol(c, ex, i);
  const open = openPanels.get(i);
  if(open){ fillPanel(c, ex, i, open); const p = c.querySelector(".panel"); p.style.maxHeight = "none"; c.querySelector(`[data-p="${open}"]`).classList.add("on"); }
  return c;
}

function togglePanel(c, ex, i, which){
  const panel = c.querySelector(".panel"), current = openPanels.get(i);
  c.querySelectorAll(".act").forEach(b => b.classList.remove("on"));
  if(current === which){ closePanel(panel); openPanels.delete(i); return; }
  openPanels.set(i, which);
  c.querySelector(`[data-p="${which}"]`).classList.add("on");
  fillPanel(c, ex, i, which);
  panel.style.maxHeight = "0px";
  requestAnimationFrame(() => { panel.style.maxHeight = panel.scrollHeight + "px"; });
  panel.addEventListener("transitionend", function te(){ if(openPanels.get(i)) panel.style.maxHeight = "none"; panel.removeEventListener("transitionend", te); });
}
function closePanel(panel){
  panel.style.maxHeight = panel.scrollHeight + "px";
  requestAnimationFrame(() => { panel.style.maxHeight = "0px"; });
}

function fillPanel(c, ex, i, which){
  const inner = c.querySelector(".panel-in"), d = S.day, cur = curFor(d, i);
  if(which === "swap"){
    inner.innerHTML = `<div class="swap-list">${ex.opts.map((o, k) => `<div class="opt"><span>OPT ${k + 1}</span>${esc(o)}</div>`).join("")}</div>
      <div class="swap-rule">Primary busy → take the first free option. Never wait. Log whichever you actually did.</div>`;
    return;
  }
  const names = [ex.name, ...ex.opts], n = setsFor(ex);
  const last = lastEntry(d, i, varName(ex, cur.v));
  while(cur.sets.length < n) cur.sets.push({ kg:"", reps:"" });
  inner.innerHTML = `
    <div class="lbl">EXERCISE YOU DID</div>
    <div class="vars">${names.map((nm, k) => `<button class="var${k === cur.v ? " sel" : ""}" data-v="${k}"><i>${k === 0 ? "MAIN" : "OPT " + k}</i>${esc(nm)}</button>`).join("")}</div>
    <div class="sets-head"><span>SET</span><span>KG</span><span>REPS</span><span>LAST</span></div>
    ${Array.from({ length:n }, (_, k) => {
      const s = cur.sets[k], p = last && last.sets[k];
      return `<div class="set-row${num(s.reps) > 0 ? " filled" : ""}" data-k="${k}">
        <div class="set-no">${k + 1}</div>
        <input inputmode="decimal" enterkeyhint="next" data-f="kg" value="${esc(s.kg)}" placeholder="${p ? esc(p.kg || 0) : "kg"}">
        <input inputmode="numeric" enterkeyhint="next" data-f="reps" value="${esc(s.reps)}" placeholder="${ex.lo}–${ex.hi}">
        <div class="set-prev">${p && num(p.reps) ? `${num(p.kg) || 0}×${num(p.reps)}` : "—"}</div>
      </div>`; }).join("")}
    <div class="lbl" style="margin-top:14px">HOW MANY REPS LEFT IN THE TANK? (AVG RIR)</div>
    <div class="rir">${[0,1,2,3,4].map(r => `<button data-r="${r}" class="${cur.rir === r ? "sel" : ""}">${r}${r === 4 ? "+" : ""}</button>`).join("")}</div>
    <div class="ex-vol"><small>EXERCISE VOLUME</small><div><b data-exvol>0 kg</b><em data-exdiff></em></div></div>`;

  inner.querySelectorAll(".var").forEach(b => b.onclick = () => {
    const v = +b.dataset.v; if(v === cur.v) return;
    cur.v = v; save();
    c.querySelector(".name").textContent = varName(ex, v);
    fillPanel(c, ex, i, "log"); updateCardVol(c, ex, i); refreshStats(true);
  });
  inner.querySelectorAll(".rir button").forEach(b => b.onclick = () => {
    const r = +b.dataset.r; cur.rir = cur.rir === r ? null : r; save();
    inner.querySelectorAll(".rir button").forEach(x => x.classList.toggle("sel", +x.dataset.r === cur.rir));
  });
  inner.querySelectorAll(".set-row input").forEach(inp => {
    inp.addEventListener("input", () => {
      const row = inp.closest(".set-row"), k = +row.dataset.k;
      const clean = inp.dataset.f === "kg" ? inp.value.replace(/[^0-9.,]/g, "") : inp.value.replace(/[^0-9]/g, "");
      if(clean !== inp.value) inp.value = clean;
      cur.sets[k][inp.dataset.f] = clean;
      // carry the first set's weight forward to empty later sets
      if(inp.dataset.f === "kg" && k === 0){
        inner.querySelectorAll('.set-row input[data-f="kg"]').forEach((o, j) => { if(j > 0 && !cur.sets[j].kg){ o.placeholder = clean || o.placeholder; } });
      }
      row.classList.toggle("filled", num(cur.sets[k].reps) > 0);
      save(); updateCardVol(c, ex, i); refreshStats(true);
      const filled = filledSets(cur.sets.slice(0, n)).length;
      if(filled === n && !doneList().includes(i)) toggleDone(i, c, false);
    });
    inp.addEventListener("focus", () => {
      // auto-fill kg from placeholder (last time / set 1) when you start typing reps
      if(inp.dataset.f === "reps"){
        const row = inp.closest(".set-row"), k = +row.dataset.k, kgIn = row.querySelector('[data-f="kg"]');
        if(!kgIn.value && num(kgIn.placeholder) > 0){ kgIn.value = kgIn.placeholder; cur.sets[k].kg = kgIn.placeholder; save(); }
      }
    });
  });
  updateCardVol(c, ex, i);
}

function updateCardVol(c, ex, i){
  const cur = curFor(S.day, i), v = entryVol(cur.sets.slice(0, setsFor(ex)));
  const tag = c.querySelector("[data-vol]"); if(tag) tag.textContent = v ? `· ${fmt(v)} kg` : "";
  const ev = c.querySelector("[data-exvol]");
  if(ev){
    ev.textContent = fmt(v) + " kg";
    const last = lastEntry(S.day, i, varName(ex, cur.v)), df = c.querySelector("[data-exdiff]");
    if(last && v){ const diff = v - entryVol(last.sets); df.textContent = (diff >= 0 ? "+" : "−") + fmt(Math.abs(diff)) + " vs last"; df.className = diff >= 0 ? "up" : "down"; }
    else df.textContent = "";
  }
}

function toggleDone(i, c, manual){
  const dl = doneList(), pos = dl.indexOf(i);
  if(pos === -1){ dl.push(i); c.classList.add("done", "pop"); setTimeout(() => c.classList.remove("pop"), 460); }
  else if(manual){ dl.splice(pos, 1); c.classList.remove("done"); }
  save(); refreshStats(true);
}

function sessionVol(d){
  const day = PLAN.days[d]; let v = 0, logged = 0, total = 0;
  day.items.forEach((ex, i) => { const n = setsFor(ex), cur = curFor(d, i); total += n; v += entryVol(cur.sets.slice(0, n)); logged += filledSets(cur.sets.slice(0, n)).length; });
  return { v, logged, total };
}

let shownPct = 0, raf;
function refreshStats(animate){
  const n = PLAN.days[S.day].items.length, dn = doneList().length, pct = n ? Math.round(dn / n * 100) : 0;
  const sv = sessionVol(S.day);
  $("ringVal").style.strokeDashoffset = RING * (1 - pct / 100);
  $("miniVal").style.strokeDashoffset = MINI * (1 - pct / 100);
  $("topProg").style.width = pct + "%";
  $("miniPct").textContent = pct + "%";
  $("hsVol").textContent = fmt(sv.v);
  $("hsSets").textContent = `${sv.logged}/${sv.total}`;
  $("miniSub").innerHTML = `<em>${fmt(sv.v)} kg</em> · ${dn}/${n} done`;
  const f = $("cycle").children[S.day]?.querySelector(".fill"); if(f) f.style.width = pct + "%";
  cancelAnimationFrame(raf);
  if(!animate){ $("pct").textContent = pct + "%"; shownPct = pct; }
  else{
    const from = shownPct, t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 450), v = Math.round(from + (pct - from) * (1 - Math.pow(1 - k, 3))); $("pct").textContent = v + "%"; if(k < 1) raf = requestAnimationFrame(step); else shownPct = pct; };
    raf = requestAnimationFrame(step);
    if(pct === 100 && from !== 100){ const r = $("ring"); r.classList.remove("full"); void r.offsetWidth; r.classList.add("full"); }
  }
  const cta = $("cta"), left = n - dn;
  cta.classList.toggle("ready", left === 0);
  cta.textContent = left === 0 ? `COMPLETE DAY ${S.day + 1}` : `${left} EXERCISE${left > 1 ? "S" : ""} TO GO`;
  $("skip").style.display = left === 0 ? "none" : "block";
}

function swapRender(){
  document.body.style.transition = "opacity .2s"; document.body.style.opacity = ".0";
  setTimeout(() => { renderAll(); window.scrollTo({ top:0 }); document.body.style.opacity = "1"; }, 180);
}

/* ---------- finishing ---------- */
function thisWeekCount(){
  const now = new Date(), m = new Date(now); m.setHours(0,0,0,0); m.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  return S.dates.filter(t => t >= m.getTime()).length;
}
function finishDay(){
  const d = S.day, day = PLAN.days[d], n = day.items.length, pct = Math.round(doneList().length / n * 100);
  const wk = week(), sv = sessionVol(d), now = Date.now();
  day.items.forEach((ex, i) => {
    const cur = curFor(d, i), sets = cur.sets.slice(0, setsFor(ex));
    if(filledSets(sets).length){
      S.hist.push({ date:now, week:wk, day:d, order:i + 1, target:`${ex.tag} — ${ex.sub}`, sets:sets.map(s => ({ kg:s.kg, reps:s.reps })), setsRx:setsFor(ex), top:ex.hi, ex:varName(ex, cur.v), rir:cur.rir, next: isDeload() ? "Deload: hold load, -1 set" : nextSessionText(ex, sets) });
    }
  });
  const prev = [...S.dayVol].reverse().find(x => x.day === d);
  S.dayVol.push({ date:now, day:d, vol:sv.v, pct });
  S.dates.push(now); S.sessions += 1;
  S.done[String(d)] = []; S.cur[String(d)] = {};
  S.day = (d + 1) % PLAN.days.length;
  save(); openPanels.clear();

  $("celeNum").textContent = String(d + 1).padStart(2, "0");
  $("celeTitle").innerHTML = pct === 100 ? `DAY ${d + 1} <span>CRUSHED</span>` : `DAY ${d + 1} <span>LOGGED</span>`;
  const diff = prev && prev.vol && sv.v ? Math.round((sv.v - prev.vol) / prev.vol * 100) : null;
  $("celeSub").innerHTML = S.day === 0
    ? `Week ${wk} complete. ${wk >= PLAN.weeks ? "That's the full 8-week plan — time for BCA + tape." : "On to week " + (wk + 1) + "."}`
    : (diff === null ? (sv.v ? "First logged session for this day — the baseline is set." : "Session logged.") : `Volume ${diff >= 0 ? "up" : "down"} <b style="color:${diff >= 0 ? "#5CFFB0" : "#FF8A8A"}">${Math.abs(diff)}%</b> vs last Day ${d + 1}.`);
  $("celeStats").innerHTML = `<div><b>${fmt(sv.v)}</b><small>KG VOLUME</small></div><div><b>${sv.logged}</b><small>SETS</small></div><div><b>${pct}%</b><small>DONE</small></div>`;
  $("celeNext").textContent = `Day ${S.day + 1} · ${PLAN.days[S.day].title}`;
  $("celeRest").textContent = day.restAfter ? "Rest day first — then this one." : "";
  $("celebrate").classList.add("open");
  if(pct === 100) confetti();
}
$("cta").onclick = () => { if(doneList().length === PLAN.days[S.day].items.length) finishDay(); };
$("skip").onclick = () => { if(confirm("Finish this day with some exercises not done? Logged sets are still saved.")) finishDay(); };
$("celeGo").onclick = () => { $("celebrate").classList.remove("open"); swapRender(); };

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ["#00F0FF","#0096FF","#FFFFFF","#5CFFB0","#8EF3FF"];
  const P = Array.from({ length:110 }, () => ({ x:innerWidth / 2 + (Math.random() - .5) * 60, y:innerHeight * .36, vx:(Math.random() - .5) * 11, vy:-Math.random() * 12 - 4, w:5 + Math.random() * 6, h:8 + Math.random() * 8, r:Math.random() * 6, vr:(Math.random() - .5) * .35, c:cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now();
  (function tick(t){ const e = t - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(q => { q.vy += .32; q.vx *= .99; q.x += q.vx; q.y += q.vy; q.r += q.vr; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.globalAlpha = Math.max(0, 1 - e / 2200); ctx.fillStyle = q.c; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h * Math.abs(Math.cos(q.r))); ctx.restore(); });
    if(e < 2200) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight); })(t0);
}

/* ---------- menu / backup ---------- */
function openSheet(){
  $("planCard").innerHTML = `<b>${esc(PLAN.name)}</b><small>Week ${week()} of ${PLAN.weeks}${isDeload() ? " (deload)" : ""} · ${S.sessions} sessions · ${S.hist.length} exercises logged</small>`;
  $("rules").innerHTML = PLAN.rules.map(([k, t]) => `<div><b>${esc(k)}</b> — ${esc(t)}</div>`).join("");
  $("overlay").classList.add("open"); $("sheet").classList.add("open");
}
function closeSheet(){ $("overlay").classList.remove("open"); $("sheet").classList.remove("open"); }
$("menuBtn").onclick = openSheet; $("overlay").onclick = closeSheet;

function stamp(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
async function shareFile(name, text, type){
  const blob = new Blob([text], { type });
  try{
    const file = new File([blob], name, { type });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); toast("Exported ✓"); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Exported ✓");
}
$("exportJson").onclick = () => shareFile(`GymX-backup-${stamp()}.json`, JSON.stringify({ app:"GymX", v:4, exported:new Date().toISOString(), state:S }, null, 1), "application/json");
$("exportCsv").onclick = () => {
  const head = ["Week","Date","Day","Order","Target","Sets","Top Rep","Exercise Performed","Set1 kg","Set1 reps","Set2 kg","Set2 reps","Set3 kg","Set3 reps","Set4 kg","Set4 reps","RIR (avg)","Next session","Volume kg"];
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = S.hist.map(h => {
    const d = new Date(h.date), ds = `${String(d.getDate()).padStart(2,"0")}-${d.toLocaleString("en-GB",{month:"short"})}-${String(d.getFullYear()).slice(2)}`;
    const cells = []; for(let k = 0; k < 4; k++){ const s = h.sets[k]; cells.push(s ? s.kg : "", s ? s.reps : ""); }
    return [h.week, ds, `Day ${h.day + 1}`, h.order, h.target, h.setsRx, h.top, h.ex, ...cells, h.rir ?? "", h.next, Math.round(entryVol(h.sets))].map(q).join(",");
  });
  if(!rows.length){ toast("Nothing logged yet"); return; }
  shareFile(`GymX-log-${stamp()}.csv`, "\uFEFF" + [head.join(","), ...rows].join("\n"), "text/csv");
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result), st = data.state || data;
      if(!st || !Array.isArray(st.hist)) throw 0;
      if(!confirm(`Restore backup from ${data.exported ? new Date(data.exported).toLocaleString() : "file"}? This replaces current data.`)) return;
      S = Object.assign(fresh(), st); save(); closeSheet(); openPanels.clear(); swapRender(); toast("Backup restored ✓");
    }catch(err){ toast("That file isn't a GymX backup"); }
    e.target.value = "";
  };
  r.readAsText(f);
};
$("resetBtn").onclick = () => {
  if(confirm("Delete ALL progress and logs? Export a backup first if you want to keep them.") && confirm("Are you sure? This can't be undone.")){
    S = fresh(); save(); closeSheet(); openPanels.clear(); swapRender();
  }
};

function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- sticky header state + keyboard ---------- */
new IntersectionObserver(([e]) => $("top").classList.toggle("scrolled", !e.isIntersecting), { rootMargin:"-70px 0px 0px 0px", threshold:0 }).observe($("hero"));
document.addEventListener("focusin", e => { if(e.target.tagName === "INPUT") document.body.classList.add("typing"); });
document.addEventListener("focusout", e => { if(e.target.tagName === "INPUT") setTimeout(() => { if(document.activeElement.tagName !== "INPUT") document.body.classList.remove("typing"); }, 60); });

renderAll();
</script>
