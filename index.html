<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymX">
<meta name="theme-color" content="#050709">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>GymX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050709; --surface:#0D1216; --surface-2:#141B21; --surface-3:#1B242C;
    --border:#1E2930; --border-2:#2A3942;
    --text:#F2FBFF; --muted:#A2B6C0; --faint:#62757F;
    --accent:#00E5FF; --accent-2:#0096FF; --on-accent:#00161C; --soft:#8EF3FF;
    --warn:#FFB86B; --good:#5CFFB0; --bad:#FF8A8A;
    --grad:linear-gradient(135deg,#00F0FF,#0096FF);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--text);}
  body{font-family:'Inter',-apple-system,'Helvetica Neue',sans-serif; font-size:16px; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; -webkit-text-size-adjust:100%;}
  button{font-family:inherit; cursor:pointer; color:inherit; -webkit-user-select:none; user-select:none;}
  .display{font-family:'Oswald','Arial Narrow',sans-serif; font-weight:700; letter-spacing:.3px;}
  body.lock{overflow:hidden;}

  /* ---------- sticky header ---------- */
  .top{position:sticky; top:0; z-index:20; padding:calc(env(safe-area-inset-top) + 8px) 14px 10px; background:rgba(5,7,9,.9); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border-bottom:1px solid var(--border);}
  .top-row{display:flex; align-items:center; gap:11px;}
  .logo{width:40px; height:40px; flex-shrink:0;}
  .tt{flex:1; min-width:0;}
  .tt-title{font-size:21px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase;}
  .tt-title span{color:var(--accent);}
  .tt-sub{font-size:13px; color:var(--muted); font-weight:600; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tt-sub b{color:var(--accent); font-weight:800;}
  .ring{position:relative; width:52px; height:52px; flex-shrink:0;}
  .ring svg{width:52px; height:52px; transform:rotate(-90deg);}
  .ring .track{stroke:var(--surface-3);}
  .ring .val{stroke:var(--accent); transition:stroke-dashoffset .6s var(--ease);}
  .ring b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;}
  .ring.full{animation:pop .6s var(--ease);}
  .icon-btn{width:44px; height:44px; border-radius:50%; flex-shrink:0; border:1px solid var(--border); background:var(--surface); font-size:20px; display:flex; align-items:center; justify-content:center;}
  .strip{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:10px;}
  .dchip{height:36px; border-radius:11px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:800; color:var(--faint); position:relative; overflow:hidden; transition:transform .15s;}
  .dchip:active{transform:scale(.94);}
  .dchip.past{color:var(--muted);}
  .dchip.cur{border-color:var(--accent); color:var(--text); background:var(--surface-2);}
  .dchip i{position:absolute; left:0; bottom:0; height:3px; background:var(--grad); transition:width .5s var(--ease);}
  .top-prog{position:absolute; left:0; right:0; bottom:-1px; height:2px;}
  .top-prog i{display:block; height:100%; width:0; background:var(--grad); transition:width .5s var(--ease); box-shadow:0 0 10px var(--accent);}

  /* ---------- compact list ---------- */
  main{padding:10px 14px 130px;}
  .row{display:grid; grid-template-columns:46px 1fr auto; gap:12px; align-items:center; min-height:70px; padding:10px 12px; margin-bottom:8px; border-radius:16px; background:var(--surface); border:1px solid var(--border); transition:transform .15s var(--ease), background .3s, border-color .3s; animation:fadeUp .4s var(--ease) both; animation-delay:calc(var(--i) * 35ms);}
  .row:active{transform:scale(.98);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  .row.done{background:#0A0F12; border-color:rgba(0,229,255,.35);}
  .row.extra{background:transparent; border-style:dashed;}
  .row.extra.done{background:#0A0F12; border-style:solid;}
  .chk{width:46px; height:46px; border-radius:50%; border:2px solid var(--border-2); background:var(--surface-2); display:flex; align-items:center; justify-content:center; position:relative; font-family:'Oswald',sans-serif; font-size:17px; color:var(--muted); transition:background .25s, border-color .25s, transform .15s;}
  .chk:active{transform:scale(.9);}
  .chk svg.ic{width:22px; height:22px;}
  .chk svg.tick{position:absolute; width:22px; height:22px; opacity:0;}
  .chk svg.tick path{stroke-dasharray:24; stroke-dashoffset:24;}
  .row.done .chk{background:var(--grad); border-color:transparent; color:transparent;}
  .row.done .chk svg.ic{opacity:0;}
  .row.done .chk svg.tick{opacity:1;}
  .row.done .chk svg.tick path{animation:draw .35s .05s var(--ease) forwards;}
  .row.pop .chk{animation:pop .45s var(--ease);}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{35%{transform:scale(1.2)}}
  .rmid{min-width:0;}
  .rname{font-size:17px; font-weight:800; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .row.done .rname{color:var(--muted);}
  .rsub{font-size:13.5px; color:var(--muted); margin-top:4px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rsub em{font-style:normal; color:var(--c, var(--accent)); font-weight:800;}
  .rright{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .dots{display:flex; gap:4px;}
  .dots i{width:9px; height:9px; border-radius:50%; background:var(--border-2);}
  .dots i.on{background:var(--accent); box-shadow:0 0 6px rgba(0,229,255,.6);}
  .rvol{font-size:13px; font-weight:800; color:var(--accent); white-space:nowrap;}
  .tag{font-size:11px; font-weight:800; letter-spacing:.6px; padding:4px 8px; border-radius:7px; white-space:nowrap;}
  .tag.go{background:var(--accent); color:var(--on-accent);}
  .tag.low{background:rgba(255,184,107,.14); color:var(--warn);}
  .tag.opt{color:var(--faint); border:1px solid var(--border-2);}
  .tag.req{color:var(--soft); border:1px solid rgba(0,229,255,.35);}
  .tag.deload{background:rgba(255,184,107,.14); color:var(--warn);}

  /* ---------- footer ---------- */
  footer{position:fixed; left:0; right:0; bottom:0; z-index:15; padding:14px 14px calc(env(safe-area-inset-bottom) + 10px); background:linear-gradient(to top,var(--bg) 72%,rgba(5,7,9,0));}
  .cta{width:100%; padding:18px; border:none; border-radius:18px; font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; letter-spacing:1px; background:var(--surface-3); color:var(--muted); position:relative; overflow:hidden; transition:transform .15s, background .3s;}
  .cta:active{transform:scale(.97);}
  .cta.ready{background:var(--grad); color:var(--on-accent); animation:glow 1.8s ease-in-out infinite;}
  .cta.ready::after{content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); transform:skewX(-20deg); animation:shine 2.4s ease-in-out infinite;}
  @keyframes glow{50%{box-shadow:0 10px 38px -6px var(--accent)}}
  @keyframes shine{0%{left:-60%}60%,100%{left:130%}}
  .skip{display:block; width:100%; margin-top:6px; padding:6px; background:none; border:none; font-size:13.5px; color:var(--faint);}

  /* ---------- sheets ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.66); opacity:0; pointer-events:none; transition:opacity .25s; z-index:30;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:31; background:#0A0F13; border-top:1px solid var(--border); border-radius:26px 26px 0 0; transform:translateY(105%); transition:transform .35s var(--ease); max-height:94vh; display:flex; flex-direction:column;}
  .sheet.open{transform:none;}
  .sh-head{padding:10px 16px 12px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .grab{width:44px; height:5px; border-radius:3px; background:var(--border-2); margin:0 auto 12px;}
  .sh-top{display:flex; gap:12px; align-items:flex-start;}
  .sh-top > div{flex:1; min-width:0;}
  .sh-name{font-size:21px; font-weight:800; line-height:1.2;}
  .sh-rx{font-size:14px; color:var(--muted); margin-top:5px; font-weight:600;}
  .sh-rx b{color:var(--accent);}
  .close{width:40px; height:40px; border-radius:50%; border:1px solid var(--border-2); background:var(--surface); font-size:18px; flex-shrink:0;}
  .sh-body{padding:12px 16px 12px; overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1;}
  .sh-foot{padding:12px 16px calc(env(safe-area-inset-bottom) + 14px); border-top:1px solid var(--border); flex-shrink:0; background:#0A0F13;}
  .lbl{font-size:11.5px; font-weight:800; letter-spacing:1.4px; color:var(--faint); margin:12px 0 7px;}
  .lbl:first-child{margin-top:2px;}
  .vars{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
  .var{text-align:left; padding:10px 11px; border-radius:12px; border:1.5px solid var(--border-2); background:var(--surface); font-size:13.5px; font-weight:600; line-height:1.25; min-height:48px; color:var(--muted);}
  .var small{display:block; font-size:10.5px; font-weight:800; letter-spacing:.8px; color:var(--faint); margin-bottom:2px;}
  .var.sel{border-color:var(--accent); background:rgba(0,229,255,.09); color:var(--text);}
  .var.sel small{color:var(--accent);}
  .seg{display:flex; gap:6px; align-items:center;}
  .seg button{flex:1; height:40px; border-radius:11px; border:1.5px solid var(--border-2); background:var(--surface); font-size:14px; font-weight:700; color:var(--muted);}
  .seg button.sel{border-color:var(--accent); color:var(--accent); background:rgba(0,229,255,.08);}
  .seg .stepbtn{flex:0 0 auto; padding:0 12px; color:var(--text);}
  .lastline{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding:11px 12px; border-radius:13px; background:var(--surface); border:1px solid var(--border);}
  .lastline div{font-size:14px; color:var(--muted); line-height:1.35; min-width:0;}
  .lastline b{color:var(--text);}
  .copy{flex-shrink:0; height:40px; padding:0 14px; border-radius:11px; border:none; background:var(--grad); color:var(--on-accent); font-weight:800; font-size:14px;}
  .copy:disabled{background:var(--surface-3); color:var(--faint);}
  .sets-h{display:grid; grid-template-columns:30px 1fr 1fr 46px; gap:8px; font-size:11.5px; font-weight:800; letter-spacing:1px; color:var(--faint); margin:14px 0 6px;}
  .sets-h span{text-align:center;} .sets-h span:first-child{text-align:left;}
  .set{margin-bottom:8px;}
  .set-row{display:grid; grid-template-columns:30px 1fr 1fr 46px; gap:8px; align-items:center;}
  .set-row.bw{grid-template-columns:30px 1fr 46px;}
  .sno{font-family:'Oswald',sans-serif; font-size:19px; color:var(--faint);}
  .set.ok .sno{color:var(--accent);}
  .step{display:grid; grid-template-columns:40px 1fr 40px; height:50px; border-radius:13px; border:1.5px solid var(--border-2); background:var(--bg); overflow:hidden;}
  .set.ok .step{border-color:rgba(0,229,255,.4);}
  .step button{border:none; background:var(--surface-2); font-size:22px; font-weight:600; color:var(--text);}
  .step button:active{background:var(--surface-3);}
  .step input{width:100%; min-width:0; border:none; background:transparent; color:var(--faint); text-align:center; font-size:19px; font-weight:800; font-family:inherit; outline:none; padding:0; -webkit-appearance:none;}
  .set.ok .step input{color:var(--text);}
  .step input.bump{animation:bump .25s var(--ease);}
  @keyframes bump{50%{transform:scale(1.18)}}
  .unit{font-size:10px; color:var(--faint); font-weight:800; text-align:center; margin-top:-2px;}
  .okb{width:46px; height:50px; border-radius:13px; border:1.5px solid var(--border-2); background:var(--surface); display:flex; align-items:center; justify-content:center;}
  .okb svg{width:22px; height:22px;}
  .set.ok .okb{background:var(--grad); border-color:transparent;}
  .drop-add{margin:5px 0 0 38px; background:none; border:none; padding:4px 0; font-size:13px; font-weight:700; color:var(--faint);}
  .drop-add:active{color:var(--accent);}
  .drop-row{display:grid; grid-template-columns:30px 1fr 1fr 46px; gap:8px; align-items:center; margin-top:6px;}
  .drop-row.bw{grid-template-columns:30px 1fr 46px;}
  .drop-row .sno{font-size:14px; color:var(--warn); text-align:center;}
  .drop-row .step{height:44px; border-color:rgba(255,184,107,.35);}
  .drop-row .step input{color:var(--text);}
  .drop-x{width:46px; height:44px; border-radius:12px; border:1px solid var(--border-2); background:var(--surface); color:var(--faint); font-size:16px;}
  .add-set{width:100%; height:44px; margin-top:4px; border-radius:12px; border:1px dashed var(--border-2); background:none; color:var(--faint); font-weight:700; font-size:14px;}
  .rir{display:flex; gap:6px;}
  .rir button{flex:1; height:42px; border-radius:11px; border:1.5px solid var(--border-2); background:var(--surface); font-size:16px; font-weight:800; color:var(--muted);}
  .rir button.sel{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  .verdict{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px;}
  .verdict .v{font-size:14px; font-weight:700; line-height:1.35;}
  .verdict .v.go{color:var(--accent);} .verdict .v.low{color:var(--warn);} .verdict .v.hold{color:var(--muted);}
  .verdict .vol{text-align:right; flex-shrink:0;}
  .verdict .vol b{display:block; font-family:'Oswald',sans-serif; font-size:22px; color:var(--accent); line-height:1;}
  .verdict .vol small{font-size:12px; font-weight:700;}
  .save{width:100%; padding:17px; border:none; border-radius:16px; background:var(--grad); color:var(--on-accent); font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; letter-spacing:1px;}
  .save:active{transform:scale(.98);}
  .note{font-size:14px; color:var(--soft); line-height:1.45; margin-top:10px;}
  .swaprule{font-size:13px; color:var(--faint); margin-top:8px; line-height:1.4;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chips button{height:46px; padding:0 16px; border-radius:23px; border:1.5px solid var(--border-2); background:var(--surface); font-size:15px; font-weight:700; color:var(--muted);}
  .chips button.sel{border-color:var(--accent); color:var(--on-accent); background:var(--accent);}
  .tickline{display:flex; align-items:center; gap:12px; width:100%; margin-top:10px; padding:14px; border-radius:14px; border:1.5px solid var(--border-2); background:var(--surface); font-size:15px; font-weight:700; text-align:left;}
  .tickline span{width:26px; height:26px; border-radius:8px; border:2px solid var(--border-2); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--on-accent);}
  .tickline.sel{border-color:var(--accent);}
  .tickline.sel span{background:var(--accent); border-color:var(--accent);}
  .guide{font-size:14.5px; color:var(--muted); line-height:1.5;}
  .guide b{color:var(--text);}
  .guide div{margin-bottom:9px;}
  .wkbox{padding:12px 14px; border-radius:14px; background:linear-gradient(135deg,rgba(0,229,255,.13),rgba(0,150,255,.06)); border:1px solid rgba(0,229,255,.35); color:#CFF8FF; font-size:14.5px; line-height:1.45;}
  .wkbox b{color:var(--accent);}

  /* menu */
  .plan-card{padding:14px 16px; border-radius:16px; background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(0,150,255,.05)); border:1px solid rgba(0,229,255,.3);}
  .plan-card b{display:block; font-size:18px;}
  .plan-card small{display:block; font-size:14px; color:var(--muted); margin-top:4px; line-height:1.45;}
  .mbtn{width:100%; text-align:left; padding:15px; border-radius:15px; border:1px solid var(--border-2); background:var(--surface); margin-bottom:9px; display:flex; align-items:center; gap:13px; font-size:16px; font-weight:700;}
  .mbtn svg{width:24px; height:24px; flex-shrink:0;}
  .mbtn small{display:block; font-size:13px; font-weight:500; color:var(--muted); margin-top:2px;}
  .danger{width:100%; margin-top:6px; padding:15px; border-radius:15px; border:1px solid rgba(255,90,90,.35); background:rgba(255,90,90,.08); color:var(--bad); font-size:15.5px; font-weight:700;}

  /* celebration */
  .celebrate{position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:rgba(3,5,7,.93); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .3s; padding:24px;}
  .celebrate.open{opacity:1; pointer-events:auto;}
  #confetti{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .cele{position:relative; text-align:center; width:100%; max-width:380px; transform:scale(.92); transition:transform .45s var(--ease);}
  .celebrate.open .cele{transform:none;}
  .medal{width:110px; height:110px; margin:0 auto 16px; border-radius:50%; background:var(--grad); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 12px rgba(0,229,255,.1),0 20px 60px -10px var(--accent); animation:medal 1.3s var(--ease);}
  .medal b{font-family:'Oswald',sans-serif; font-size:36px; color:var(--on-accent);}
  @keyframes medal{0%{transform:scale(.3) rotate(-30deg); opacity:0}60%{transform:scale(1.1) rotate(6deg); opacity:1}100%{transform:none}}
  .cele-title{font-size:36px; line-height:1.05; text-transform:uppercase;}
  .cele-title span{color:var(--accent);}
  .cele-sub{color:var(--muted); font-size:15.5px; margin:10px 0 16px; line-height:1.45;}
  .cele-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;}
  .cele-stats div{background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:12px 4px;}
  .cele-stats b{display:block; font-family:'Oswald',sans-serif; font-size:21px;}
  .cele-stats small{font-size:10.5px; color:var(--faint); font-weight:800; letter-spacing:.8px;}
  .next-up{background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:13px; margin-bottom:12px; text-align:left;}
  .next-up small{font-size:11.5px; color:var(--faint); font-weight:800; letter-spacing:1.4px;}
  .next-up b{display:block; font-size:17px; margin-top:3px;}
  .next-up em{display:block; font-style:normal; font-size:14px; color:var(--accent); margin-top:3px; font-weight:600;}

  .toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 100px); transform:translate(-50%,20px); background:var(--surface-3); border:1px solid var(--border-2); padding:12px 18px; border-radius:30px; font-size:14.5px; font-weight:700; opacity:0; transition:opacity .25s, transform .25s var(--ease); z-index:60; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1; transform:translate(-50%,0);}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important; transition:none !important;}}
</style>
</head>
<body>

<div class="top" id="top">
  <div class="top-row">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#0096FF"/></linearGradient>
        <g id="db"><rect x="14" y="46.5" width="72" height="7" rx="3.5"/><rect x="18" y="36" width="8" height="28" rx="3"/><rect x="10" y="40.5" width="7" height="19" rx="3"/><rect x="74" y="36" width="8" height="28" rx="3"/><rect x="83" y="40.5" width="7" height="19" rx="3"/></g>
      </defs>
      <rect width="100" height="100" rx="22" fill="#0D1216"/>
      <g transform="translate(50 50) scale(.86) translate(-50 -50)">
        <use href="#db" fill="#FFFFFF" transform="rotate(-45 50 50)"/>
        <use href="#db" fill="#0D1216" stroke="#0D1216" stroke-width="8" stroke-linejoin="round" transform="rotate(45 50 50)"/>
        <use href="#db" fill="url(#cg)" transform="rotate(45 50 50)"/>
      </g>
    </svg>
    <div class="tt">
      <div class="tt-title display" id="ttTitle">Day 1 · Lower A</div>

<script>
/* =====================================================================

const PLAN = {

    ]},

    ]},

      {tag:"Glutes/Hams", sub:"Glute max + hamstrings", name:"DB Romanian Deadlift", opts:["Barbell RDL","Smith RDL","Cable Pull-Through"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2–3 min", notes:"Hips back, neutral spine, stretch hamstrings"},
      {tag:"Quads", sub:"Vastus group + glutes", name:"Leg Press (feet mid-high)", opts:["Hack Squat","Smith Squat","Goblet Squat"], sets:3, lo:10, hi:15, rir:"1–2", rest:"2 min", notes:"Full ROM you tolerate"},

      {tag:"Hamstrings", sub:"Biceps femoris / semis", name:"Lying Leg Curl", opts:["Seated Leg Curl","DB Leg Curl (bench)","Stability-Ball / Slider Curl"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1.5 min"},
      {tag:"Glutes", sub:"Glute med / min", name:"Hip Abduction Machine (if available)", opts:["Cable Hip Abduction","Banded Seated Abduction","Side-Lying Hip Abduction"], sets:2, lo:12, hi:20, rir:"1–2", rest:"1 min"},
      {tag:"Calves", sub:"Soleus", name:"Seated Calf Raise", opts:["Leg Press Calf Raise","Bent-Knee DB Calf Raise","Single-Leg Calf Raise"], sets:2, lo:10, hi:15, rir:"1–2", rest:"1 min"}
    ]},

      {tag:"Back", sub:"Lats", name:"Lat Pulldown (least-irritating grip)", opts:["Assisted Pull-Up","Single-Arm Cable Pulldown","Chest-Supported DB Row (elbows to hip)"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2 min"},
      {tag:"Back", sub:"Upper back / traps / lats", name:"One-Arm DB Row (bench)", opts:["Seated Cable Row","Machine Row","Chest-Supported DB Row"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2 min", notes:"Replaces direct shrugs — rows cover traps"},
      {tag:"Chest", sub:"Mid (sternal)", name:"Pec Deck Fly", opts:["Cable Fly (mid height)","Flat DB Fly (limited stretch)","Machine Chest Press"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1.5 min", notes:"Stop the stretch where shoulder stays comfortable"},
      {tag:"Rear delts", sub:"Horizontal abduction", name:"Reverse Pec Deck", opts:["Cable Face Pull (rope)","Chest-Supported DB Rear-Delt Raise","Bent-Over DB Rear-Delt Raise"], sets:3, lo:12, hi:20, rir:"1–2", rest:"1 min", notes:"Same machine as fly — back-to-back sets optional, not a superset requirement"},

    ]},

      {tag:"Glutes", sub:"Glute max", name:"Barbell / DB Hip Thrust (bench)", opts:["Smith Hip Thrust","DB Glute Bridge (floor)","Cable Pull-Through"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2 min", notes:"Done first because glutes are priority #1"},
      {tag:"Chest", sub:"Upper (clavicular)", name:"Low-Incline Smith Press", opts:["Low-Incline DB Press (neutral)","Machine Chest Press","Low-to-High Cable Press"], sets:3, lo:8, hi:12, rir:"1–2", rest:"2–3 min"},
      {tag:"Side delts", sub:"Abduction", name:"Single-Arm Cable Lateral Raise", opts:["DB Lateral Raise","Lean-Away DB Lateral Raise","Chest-Supported Y-Raise"], sets:3, lo:12, hi:20, rir:"1–2", rest:"1–1.5 min", notes:"Cable version differs from Day 2 on purpose"},
      {tag:"Biceps", sub:"Brachialis / brachioradialis + biceps", name:"DB Hammer Curl", opts:["Rope Hammer Curl","Cross-Body Hammer Curl","EZ-Bar Reverse Curl"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1–1.5 min"},
      {tag:"Triceps", sub:"Long head", name:"Seated DB Overhead Extension (two hands)", opts:["Cable Overhead Extension","Lying DB Extension (incline bench)","Cross-Body Cable Extension"], sets:3, lo:10, hi:15, rir:"1–2", rest:"1–1.5 min", notes:"If overhead position bothers the shoulder, go straight to option 2 or 3"}
    ]}
  ],
  warmup: {
    options: ["Bike", "Incline walk", "Cross-trainer"],
    minutes: "5",
    note: "5 min easy cardio, then 2 light ramp-up sets of the first exercise (don't log these). Use the ramp-ups to check how the shoulder / knee feel today."
  },
  cardio: {
    options: ["Bike", "Incline walk", "Cross-trainer"],
    minutes: ["10", "15"],
    note: "Optional. Easy pace. If you skip it, walk outside instead — it counts toward your 7–8k steps. Finish with ~5 min stretching: hip flexors, quads, pecs, lats."
  },
  session: [
    "<b>Warm-up ~8–10 min</b> — 5 min bike or incline walk + 2 light ramp-up sets of the first exercise (don't log these).",
    "<b>Lifting ~50–60 min</b> — no supersets or circuits; rest as shown on each card.",
    "<b>Cardio 10–15 min (optional)</b> — easy bike/incline walk. If taken, walk outside — counts toward your 7–8k steps.",
    "<b>Cool-down ~5 min</b> — hip flexors, quads, pecs, lats."
  ],
  weekNotes: {
    1: "<b>Week 1:</b> 2–3 RIR on every set. Many exercises are new — find loads and setups.",
    2: "<b>Weeks 2–6:</b> 1–2 RIR. Last set of isolation exercises may go to 0–1 RIR.",
    7: "<b>Week 7 — deload:</b> same exercises and loads, drop 1 set per exercise, ~3–4 RIR.",
    8: "<b>Week 8:</b> back to normal. Repeat BCA (morning, before food, same device) and tape measurements."
  },
  rules: [
    ["One exercise per target", "Primary busy → Option 1 → Option 2 → Option 3. Take the first free one. Never wait, never reserve."],
    ["Double progression", "All prescribed sets reach the top of the rep range at target RIR → add the smallest load step next session. Otherwise keep the load and add reps."],
    ["Missed a day", "Do the next Day number. Never skip ahead or double up."],
    ["Weekly pattern", "Day 1 → Day 2 → Rest → Day 3 → Day 4 → Rest → Day 5."],
    ["Shoulder / knee", "New variant: first set light. If pain rises above your usual baseline or hasn't settled by the next day → switch to the next option. No mandatory heavy overhead pressing."],
    ["Logging", "Log the exercise you actually did, with kg and reps. Ramp-up sets are not logged."]
  ]
};

/* =================== DO NOT EDIT BELOW THIS LINE ==================== */

const TAG_COLORS = {"quads":"#4DE3FF","glutes":"#5CFFB0","glutes/hams":"#7CFFD4","hamstrings":"#8AB4FF","calves":"#C4A8FF","chest":"#FF9ECF","back":"#FFC76B","side delts":"#FF8A8A","rear delts":"#FFA98A","biceps":"#B8FF6B","triceps":"#FFE36B","core":"#9EE7FF"};
const KEY = "gymx_state_v5";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Math.round(n).toLocaleString("en-IN");
const num = v => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(x) ? x : 0; };
const short = n => n.replace(/\s*\([^)]*\)/g, "").trim();
const UNIT_LABEL = { kg:"kg", pl:"plates", bw:"bodyweight" };
const UNIT_SHORT = { kg:"kg", pl:"pl", bw:"" };

/* ---------- state ---------- */
function fresh(){ return { v:5, day:0, sessions:0, done:{}, cur:{}, hist:[], dayVol:[], dates:[], units:{}, extra:{} }; }
function load(){
  let s = null; try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s){
    // carry over data from the previous GymX version
    try{
      const o = JSON.parse(localStorage.getItem("gymx_state_v4"));
      if(o){
        s = fresh(); s.day = o.day || 0; s.sessions = o.sessions || 0; s.dates = o.dates || [];
        s.dayVol = (o.dayVol || []).map(x => ({ date:x.date, day:x.day, kg:x.vol || 0, pl:0, pct:x.pct }));
        s.hist = (o.hist || []).map(h => ({ date:h.date, week:h.week, day:h.day, order:h.order, target:h.target, setsRx:h.setsRx, top:h.top, ex:h.ex, rir:h.rir, unit:"kg", sets:(h.sets || []).map(x => ({ w:x.kg, r:x.reps, drop:null })) }));
      }
    }catch(e){}
  }
  s = Object.assign(fresh(), s || {});
  if(s.day >= PLAN.days.length) s.day = 0;
  return s;
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Storage full — export a backup"); } }

const week = () => Math.floor(S.sessions / PLAN.days.length) + 1;
const isDeload = () => week() === PLAN.deloadWeek;
const rirNow = ex => isDeload() ? "3–4" : (week() === 1 ? "2–3" : ex.rir);
const setsFor = ex => isDeload() ? Math.max(1, ex.sets - 1) : ex.sets;
const doneList = () => { const k = String(S.day); return S.done[k] || (S.done[k] = []); };
const isDone = key => doneList().includes(key);
const extraFor = () => { const k = String(S.day); return S.extra[k] || (S.extra[k] = { warm:{ type:null, ramp:false }, cardio:{ type:null, min:null, stretch:false } }); };
const varNames = ex => [ex.name, ...ex.opts];

function guessUnit(name){
  const n = name.toLowerCase();
  if(/push-up|plank|dead bug|band/.test(n) && !/cable/.test(n)) return { u:"bw", step:0 };
  if(/\bdb\b|dumbbell|goblet/.test(n)) return { u:"kg", step:2.5 };
  if(/smith|barbell|ez-bar|hack|leg press|hip thrust/.test(n)) return { u:"kg", step:5 };
  if(/cable|machine|pec deck|extension|curl|pulldown|abduction|pull-up|row|raise|crunch|pallof|face pull|fly|pressdown/.test(n)) return { u:"pl", step:1 };
  return { u:"kg", step:2.5 };
}
const unitFor = name => S.units[name] || guessUnit(name);

function lastEntry(d, i, name){ for(let k = S.hist.length - 1; k >= 0; k--){ const h = S.hist[k]; if(h.day === d && h.order === i + 1 && h.ex === name) return h; } return null; }
function lastAnyVar(d, i){ for(let k = S.hist.length - 1; k >= 0; k--){ const h = S.hist[k]; if(h.day === d && h.order === i + 1) return h; } return null; }

function curFor(i){
  const k = String(S.day); S.cur[k] = S.cur[k] || {};
  if(!S.cur[k][i]){
    const ex = PLAN.days[S.day].items[i], la = lastAnyVar(S.day, i);
    const v = la ? Math.max(0, varNames(ex).indexOf(la.ex)) : 0;
    S.cur[k][i] = { v, sets:null, rir:null };
  }
  return S.cur[k][i];
}
function prefill(ex, i, cur){
  const name = varNames(ex)[cur.v], last = lastEntry(S.day, i, name), n = setsFor(ex);
  cur.sets = Array.from({ length:n }, (_, k) => {
    const p = last && last.sets[k];
    return { w: p ? p.w : (last && last.sets[0] ? last.sets[0].w : ""), r: p ? p.r : ex.lo, ok:false, drop:null };
  });
}
const okSets = cur => (cur.sets || []).filter(s => s.ok);
function setVol(s){ return num(s.w) * num(s.r) + (s.drop ? num(s.drop.w) * num(s.drop.r) : 0); }
function volOf(sets){ return (sets || []).reduce((a, s) => a + setVol(s), 0); }

/* progression verdict — uses the heavier (first) part of each set only */
function verdict(ex, sets, n){
  if(!sets || !sets.length) return null;
  if(isDeload()) return { cls:"hold", txt:"Deload week — hold load" };
  const main = sets.slice(0, n);
  if(main.some(s => num(s.r) > 0 && num(s.r) < ex.lo)) return { cls:"low", txt:`Below ${ex.lo} reps → lower the load` };
  if(main.length >= n && main.every(s => num(s.r) >= ex.hi && !s.drop)) return { cls:"go", txt:"All sets at top → add load next time" };
  return { cls:"hold", txt:"Keep load, add reps next time" };
}

/* ---------- main list ---------- */
const RING = 2 * Math.PI * 21;
$("ringVal").style.strokeDasharray = RING;
const ICON_WARM = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#8EF3FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.8 3 4.5 5 4.5 9.5a4.5 4.5 0 01-9 0c0-2 .9-3.4 2-4.4.2 1.4.9 2.3 1.9 2.8C11 8 11 5.5 12 3z"/></svg>`;
const ICON_CARDIO = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#8EF3FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>`;
const TICK = `<svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#00161C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function renderAll(){
  const d = S.day, day = PLAN.days[d];
  $("ttTitle").innerHTML = `Day ${d + 1} · <span>${esc(day.title)}</span>`;
  const strip = $("strip"); strip.innerHTML = "";
  PLAN.days.forEach((x, i) => {
    const b = document.createElement("button");
    b.className = "dchip" + (i < d ? " past" : "") + (i === d ? " cur" : "");
    b.innerHTML = `D${i + 1}<i style="width:${i < d ? 100 : 0}%"></i>`;
    b.onclick = () => { if(i !== d){ S.day = i; save(); fadeRender(); } };
    strip.appendChild(b);
  });
  const list = $("list"); list.innerHTML = "";
  list.appendChild(warmRow(0));
  day.items.forEach((ex, i) => list.appendChild(exRow(ex, i, i + 1)));
  list.appendChild(cardioRow(day.items.length + 1));
  refresh(false);
}

function exRow(ex, i, pos){
  const r = document.createElement("div"), cur = curFor(i), name = varNames(ex)[cur.v], n = setsFor(ex);
  r.className = "row" + (isDone(i) ? " done" : ""); r.style.setProperty("--i", pos); r.dataset.k = i;
  r.style.setProperty("--c", TAG_COLORS[ex.tag.toLowerCase()] || "#00E5FF");
  const oks = okSets(cur).length, u = unitFor(name);
  const last = lastEntry(S.day, i, name), vd = last ? verdict(ex, last.sets, last.setsRx || n) : null;
  let right = `<div class="dots">${Array.from({ length:n }, (_, k) => `<i class="${k < oks ? "on" : ""}"></i>`).join("")}</div>`;
  if(oks) right += `<div class="rvol">${u.u === "bw" ? `${okSets(cur).reduce((a, s) => a + num(s.r) + (s.drop ? num(s.drop.r) : 0), 0)} reps` : `${fmt(volOf(okSets(cur)))} ${UNIT_SHORT[u.u]}`}</div>`;
  else if(isDeload()) right += `<span class="tag deload">DELOAD</span>`;
  else if(vd && vd.cls === "go") right += `<span class="tag go">↑ LOAD</span>`;
  else if(vd && vd.cls === "low") right += `<span class="tag low">↓ LOAD</span>`;
  r.innerHTML = `<button class="chk" aria-label="Mark done">${String(pos).padStart(2, "0")}${TICK}</button>
    <div class="rmid"><div class="rname">${esc(short(name))}</div><div class="rsub"><em>${esc(ex.tag)}</em> · ${n}×${ex.lo}–${ex.hi} · ${esc(ex.rest)}</div></div>
    <div class="rright">${right}</div>`;
  r.querySelector(".chk").onclick = e => { e.stopPropagation(); toggleDone(i, r); };
  r.onclick = () => openLog(i);
  return r;
}
function warmRow(pos){
  const r = document.createElement("div"), w = extraFor().warm;
  r.className = "row extra" + (isDone("w") ? " done" : ""); r.style.setProperty("--i", pos);
  r.innerHTML = `<button class="chk" aria-label="Mark done">${ICON_WARM}${TICK}</button>
    <div class="rmid"><div class="rname">Warm-up</div><div class="rsub">${w.type ? esc(w.type) + " · " : ""}${esc(PLAN.warmup.minutes)} min + 2 ramp-up sets</div></div>
    <div class="rright"><span class="tag req">COUNTS</span></div>`;
  r.querySelector(".chk").onclick = e => { e.stopPropagation(); toggleDone("w", r); };
  r.onclick = () => openWarm();
  return r;
}
function cardioRow(pos){
  const r = document.createElement("div"), c = extraFor().cardio;
  r.className = "row extra" + (isDone("c") ? " done" : ""); r.style.setProperty("--i", pos);
  r.innerHTML = `<button class="chk" aria-label="Mark done">${ICON_CARDIO}${TICK}</button>
    <div class="rmid"><div class="rname">Cardio + stretch</div><div class="rsub">${c.type ? esc(c.type) + (c.min ? " · " + c.min + " min" : "") : "Easy · " + PLAN.cardio.minutes.join("–") + " min"}${c.stretch ? " · stretched" : ""}</div></div>
    <div class="rright"><span class="tag opt">OPTIONAL</span></div>`;
  r.querySelector(".chk").onclick = e => { e.stopPropagation(); toggleDone("c", r); };
  r.onclick = () => openCardio();
  return r;
}
function rowFor(key){
  const day = PLAN.days[S.day];
  if(key === "w") return warmRow(0);
  if(key === "c") return cardioRow(day.items.length + 1);
  return exRow(day.items[key], key, key + 1);
}
function replaceRow(key, pop){
  const list = $("list"), idx = key === "w" ? 0 : key === "c" ? list.children.length - 1 : key + 1;
  const old = list.children[idx], nu = rowFor(key);
  nu.style.animation = "none";
  if(pop){ nu.classList.add("pop"); setTimeout(() => nu.classList.remove("pop"), 460); }
  list.replaceChild(nu, old);
}
function toggleDone(key, rowEl){
  const dl = doneList(), p = dl.indexOf(key);
  if(p === -1){ dl.push(key); } else dl.splice(p, 1);
  save(); replaceRow(key, p === -1); refresh(true);
}
function setDone(key, v){
  const dl = doneList(), p = dl.indexOf(key);
  if(v && p === -1) dl.push(key); if(!v && p !== -1) dl.splice(p, 1);
}

/* ---------- totals / header ---------- */
function sessionTotals(){
  const day = PLAN.days[S.day]; let kg = 0, pl = 0, sets = 0, total = 0;
  day.items.forEach((ex, i) => {
    const cur = curFor(i), name = varNames(ex)[cur.v], u = unitFor(name).u, ok = okSets(cur);

    <button class="mbtn" id="imp"><svg viewBox="0 0 24 24" fill="none" stroke="#A2B6C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 19h16"/></svg><div>Restore from backup<small>Replaces current data with a backup file</small></div></button>
    <div class="lbl">RULES</div>
    <div class="guide">${PLAN.rules.map(([k, t]) => `<div><b>${esc(k)}</b> — ${esc(t)}</div>`).join("")}
      <div><b>Plate machines</b> — count plates from the top: the fixed top plate is 1, down to the pin. Count the same way every time.</div>
      <div><b>Dumbbells</b> — log the weight of ONE dumbbell.</div></div>
    <button class="danger" id="resetBtn">Reset everything</button>`;
  $("shFoot").innerHTML = "";
  $("exJson").onclick = () => shareFile(`GymX-backup-${stamp()}.json`, JSON.stringify({ app:"GymX", v:5, exported:new Date().toISOString(), state:S }, null, 1), "application/json");
  $("exCsv").onclick = exportCsv;
  $("imp").onclick = () => $("importFile").click();
  $("resetBtn").onclick = () => { if(confirm("Delete ALL progress and logs? Export a backup first if you want to keep them.") && confirm("Are you sure? This can't be undone.")){ S = fresh(); save(); hideSheet(); fadeRender(); } };
  showSheet();
};
function stamp(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
async function shareFile(name, text, type){
  const blob = new Blob([text], { type });
  try{ const file = new File([blob], name, { type }); if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); toast("Exported ✓"); return; } }
  catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("Exported ✓");
}
function exportCsv(){
  const head = ["Week","Date","Day","Order","Target","Sets","Top Rep","Exercise Performed","Unit","Set1 wt","Set1 reps","Set2 wt","Set2 reps","Set3 wt","Set3 reps","Set4 wt","Set4 reps","Drops","RIR (avg)","Next session","Volume"];
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = S.hist.map(h => {
    const d = new Date(h.date), ds = `${String(d.getDate()).padStart(2,"0")}-${d.toLocaleString("en-GB",{ month:"short" })}-${String(d.getFullYear()).slice(2)}`;
    const cells = []; for(let k = 0; k < 4; k++){ const s = h.sets[k]; cells.push(s ? s.w : "", s ? s.r : ""); }
    const drops = h.sets.map((s, k) => s.drop ? `S${k + 1}: ${s.drop.w}x${s.drop.r}` : "").filter(Boolean).join("; ");
    return [h.week, ds, `Day ${h.day + 1}`, h.order, h.target, h.setsRx, h.top, h.ex, UNIT_LABEL[h.unit || "kg"], ...cells, drops, h.rir ?? "", h.next, Math.round(volOf(h.sets))].map(q).join(",");
  });
  if(!rows.length){ toast("Nothing logged yet"); return; }
  shareFile(`GymX-log-${stamp()}.csv`, "\uFEFF" + [head.join(","), ...rows].join("\n"), "text/csv");
}
$("importFile").onchange = e => {
  const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result), st = data.state || data; if(!st || !Array.isArray(st.hist)) throw 0;
      if(!confirm(`Restore backup from ${data.exported ? new Date(data.exported).toLocaleString() : "file"}? This replaces current data.`)) return;
      if((data.v || st.v) === 4) st.hist = st.hist.map(h => ({ ...h, unit:"kg", sets:h.sets.map(x => ({ w:x.kg, r:x.reps, drop:null })) }));
      S = Object.assign(fresh(), st); S.v = 5; save(); hideSheet(); fadeRender(); toast("Backup restored ✓");
    }catch(err){ toast("That file isn't a GymX backup"); }
    e.target.value = "";
  };
  r.readAsText(f);
};
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

renderAll();
</script>
